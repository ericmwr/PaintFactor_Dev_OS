          </div>
          <div>
            <div className="field-label">Cross Beams</div>
            <input type="number" value={room.cross_beam_count||0} onChange={e=>setRoom('cross_beam_count',parseInt(e.target.value)||0)} min="0" max="20" disabled={!room.beams_enabled} style={{width:60,opacity:room.beams_enabled?1:0.4}} />
          </div>
          <div>
            <div className="field-label">Ridge Beams (half)</div>
            <input type="number" value={room.ridge_beam_count||0} onChange={e=>setRoom('ridge_beam_count',parseInt(e.target.value)||0)} min="0" max="20" disabled={!room.beams_enabled} style={{width:60,opacity:room.beams_enabled?1:0.4}} />
          </div>
          <div>
            <div className="field-label">Application</div>
            <select value={room.beam_application_method||'brush'} onChange={e=>setRoom('beam_application_method',e.target.value)} disabled={!room.beams_enabled} style={{opacity:room.beams_enabled?1:0.4}}>
              <option value="brush">Brush</option>
              <option value="spray">Spray</option>
              <option value="spray_backbrush">Spray & Back-brush</option>
            </select>
          </div>
        </div>
        {room.beams_enabled && derived.beamTotalLF > 0 && (
          <div style={{marginTop:6,padding:'6px 8px',background:'var(--bg-tertiary)',borderRadius:4,fontSize:11,fontFamily:'var(--font-mono)',color:'var(--text-secondary)'}}>
            <div style={{marginBottom:2,color:'var(--text-muted)',fontSize:10}}>Paintable LF = beam length × exposed faces (bottom + 2 sides)</div>
            {room.peak_beam && derived.beamPeakLF > 0 && <div>Peak: {derived.beamPeakLF} LF × 3 faces = <b>{Math.round(derived.beamPeakLF * 3)}</b> LF</div>}
            {room.cross_beam_count > 0 && derived.beamCrossLFEach > 0 && <div>Cross: {room.cross_beam_count} × {derived.beamCrossLFEach} LF × 3 faces = <b>{Math.round(room.cross_beam_count * derived.beamCrossLFEach * 3)}</b> LF</div>}
            {room.ridge_beam_count > 0 && derived.beamRidgeLFEach > 0 && <div>Ridge: {room.ridge_beam_count} × {Math.round(derived.beamRidgeLFEach*10)/10} LF × 2 faces = <b>{Math.round(room.ridge_beam_count * derived.beamRidgeLFEach * 2)}</b> LF</div>}
            <div style={{marginTop:3,color:'var(--accent)',fontWeight:600}}>Total Beam LF: {derived.beamTotalLF} LF</div>
          </div>
        )}
      </div>
      )}

      <div className="panel-section">
        <div className="section-title">What Are We Painting?</div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:8}}>Click a checked item to configure it in the panel to the right.</div>
        <div className="master-detail-container">
          <div className="master-list">
            {SUBSTRATE_GROUPS.map(g => (
              <div key={g.group} style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:600,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:4}}>{g.group}</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'2px 8px'}}>
                  {g.items.map(cat => {
                    const isDoorWin = cat.id === 'doors' || cat.id === 'windows';
                    const checked = !!subs[cat.id];
                    const isFocused = focusedSubstrate === cat.id;
                    return (
                      <div key={cat.id} className={`substrate-item${isFocused?' focused':''}`}
                        onClick={()=>handleItemClick(cat.id)}>
                        <input type="checkbox" checked={checked}
                          onChange={(e)=>{e.stopPropagation();handleToggle(cat.id);}}
                          onClick={(e)=>e.stopPropagation()} />
                        <span style={{color:checked?'var(--text-primary)':'var(--text-muted)'}}>{cat.label}</span>
                        {checked && isDoorWin && <span className="tab-indicator">{'\u2192'} tab</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
          <div className="detail-panel">
            {focusedSubstrate && subs[focusedSubstrate] ? (
              <div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div>
                    <span style={{fontWeight:600,fontSize:13}}>{SUBSTRATE_MAP[focusedSubstrate]?.label}</span>
                    <span style={{fontSize:11,color:'var(--text-muted)',marginLeft:8}}>{SUBSTRATE_MAP[focusedSubstrate]?.group} &middot; {SUBSTRATE_MAP[focusedSubstrate]?.uom}</span>
                  </div>
                  <button onClick={()=>setFocusedSubstrate(null)} style={{background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',fontSize:16}}>&times;</button>
                </div>
                <SubstrateDetailPanel room={room} derived={derived} dispatch={dispatch} substrateId={focusedSubstrate} project={project} />
              </div>
            ) : (
              <div className="detail-panel-empty">Select an item to configure</div>
            )}
          </div>
        </div>
      </div>

      <div className="panel-section">
        <div className="section-title">Room Adjacency &amp; Protection</div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:8}}>
          Mark items present in the room that are not being painted.
        </div>

        {/* Floor Type — always visible */}
        <div className="form-grid" style={{gridTemplateColumns:'1fr 1fr 1fr'}}>
          <div>
            <div className="field-label">Floor Type</div>
            <select value={room.floor_type||''} onChange={e=>{
              const ft = FLOOR_TYPES.find(f=>f.id===e.target.value);
              setRoom('floor_type',e.target.value||'');
              setRoom('floor_protection', ft ? ft.defaultProtection : '');
            }} style={{width:'100%'}}>
              <option value="">— Select —</option>
              {FLOOR_TYPES.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
            </select>
          </div>
          <div>
            <div className="field-label">Floor Protection</div>
            <select value={room.floor_protection||''} onChange={e=>setRoom('floor_protection',e.target.value)} style={{width:'100%'}} disabled={!room.floor_type || room.floor_type === 'subfloor'}>
              <option value="">—</option>
              <option value="light_mask">Light Mask</option>
              <option value="medium_mask">Medium Mask</option>
              <option value="heavy_mask">Heavy Mask</option>
            </select>
          </div>
          <div style={{alignSelf:'end',fontSize:11,color:'var(--text-muted)'}}>
            {!room.floor_type ? '' : room.floor_type === 'subfloor' ? 'Subfloor — no protection needed' : ''}
          </div>
        </div>

        {/* Master/Detail: Fixture Checklist + Config/Summary */}
        <div className="master-detail-container" style={{marginTop:8}}>
          {/* LEFT: Fixture checklist grouped by Kitchen/Bathroom/Feature */}
          <div className="master-list">
            {FIXTURE_GROUPS.map(g => (
              <div key={g.group} style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:600,color:'var(--text-secondary)',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:4}}>{g.group}</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'2px 8px'}}>
                  {g.items.map(fix => {
                    const checked = !!(room.fixtures && room.fixtures[fix.id]);
                    const isFocused = focusedFixture === fix.id;
                    return (
                      <div key={fix.id} className={'substrate-item' + (isFocused ? ' focused' : '')}
                        onClick={() => { if (checked) setFocusedFixture(fix.id); }}>
                        <input type="checkbox" checked={checked}
                          onChange={(e) => {
                            e.stopPropagation();
                            dispatch({type:'TOGGLE_FIXTURE',payload:{roomId:rid,fixtureId:fix.id}});
                            if (!checked) setFocusedFixture(fix.id);
                            else if (focusedFixture === fix.id) setFocusedFixture(null);
                          }}
                          onClick={(e) => e.stopPropagation()} />
                        <span style={{color:checked?'var(--text-primary)':'var(--text-muted)'}}>{fix.label}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {/* RIGHT: Per-fixture config (top) + Accumulated summary (bottom) */}
          <div className="detail-panel">
            {/* Per-fixture config when one is focused */}
            {focusedFixture && room.fixtures && room.fixtures[focusedFixture] && (() => {
              const cfg = room.fixtures[focusedFixture];
              const setFix = (f,v) => dispatch({type:'SET_FIXTURE',payload:{roomId:rid,fixtureId:focusedFixture,field:f,value:v}});
              const header = (
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <span style={{fontWeight:600,fontSize:13}}>{FIXTURE_MAP[focusedFixture].label}</span>
                  <button onClick={()=>setFocusedFixture(null)} style={{background:'none',border:'none',color:'var(--text-muted)',cursor:'pointer',fontSize:16}}>&times;</button>
                </div>
              );

              // Cabinet-specific config
              if (focusedFixture === 'cabinets') return (
                <div style={{marginBottom:12}}>
                  {header}
                  <div className="form-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
                    <div>
                      <div className="field-label">Layout</div>
                      <select value={cfg.layout||'lower_upper'} onChange={e=>setFix('layout',e.target.value)} style={{width:'100%'}}>
                        <option value="lower_only">Lower Only</option>
                        <option value="lower_upper">Lower + Upper</option>
                      </select>
                    </div>
                    <div>
                      <div className="field-label">Protection Level</div>
                      <select value={cfg.protection||'heavy_mask'} onChange={e=>setFix('protection',e.target.value)} style={{width:'100%'}}>
                        <option value="light_mask">Light — edge mask</option>
                        <option value="medium_mask">Medium — pin off</option>
                        <option value="heavy_mask">Heavy — full bag</option>
                      </select>
                    </div>
                  </div>
                  <div className="form-grid" style={{gridTemplateColumns:'1fr 1fr',marginTop:6}}>
                    <div>
                      <div className="field-label">Linear Feet</div>
                      <input type="number" min="0" max="200" step="0.5" value={cfg.linear_ft||0} onChange={e=>setFix('linear_ft',parseFloat(e.target.value)||0)} />
                    </div>
                    {(cfg.layout === 'lower_upper') && (
                      <div>
                        <div className="field-label">Upper Height (ft)</div>
                        <input type="number" min="1" max="6" step="0.5" value={cfg.upper_height_ft||2.5} onChange={e=>setFix('upper_height_ft',parseFloat(e.target.value)||2.5)} />
                      </div>
                    )}
                  </div>
                  <div style={{marginTop:6}}>
                    <div className="field-label">Notes</div>
                    <input type="text" value={cfg.notes||''} onChange={e=>setFix('notes',e.target.value)} style={{width:'100%'}} placeholder="e.g., L-shaped run, island separate" />
                  </div>
                </div>
              );

              // Generic fixture config
              return (
                <div style={{marginBottom:12}}>
                  {header}
                  <div className="form-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
                    <div>
                      <div className="field-label">Count</div>
                      <input type="number" min="1" max="20" value={cfg.count||1} onChange={e=>setFix('count',parseInt(e.target.value)||1)} />
                    </div>
                    <div>
                      <div className="field-label">Protection Level</div>
                      <select value={cfg.protection||'medium_mask'} onChange={e=>setFix('protection',e.target.value)} style={{width:'100%'}}>
                        <option value="light_mask">Light Mask</option>
                        <option value="medium_mask">Medium Mask</option>
                        <option value="heavy_mask">Heavy Mask</option>
                      </select>
                    </div>
                  </div>
                  <div style={{marginTop:6}}>
                    <div className="field-label">Size / Notes</div>
                    <input type="text" value={cfg.size||''} onChange={e=>setFix('size',e.target.value)} style={{width:'100%'}} placeholder="e.g., 6ft granite island" />
                  </div>
                </div>
              );
            })()}

            {/* Accumulated protection summary — always visible */}
            <div style={{borderTop: focusedFixture && room.fixtures && room.fixtures[focusedFixture] ? '1px solid var(--border)' : 'none', paddingTop:8}}>
              <div className="field-label" style={{marginBottom:4}}>Protection Summary</div>
              {protectionSummary.map(item => {
                const badgeLabel = item.protection === 'light_mask' ? 'LIGHT' : item.protection === 'medium_mask' ? 'MEDIUM' : 'HEAVY';
                return (
                  <div key={item.zone} className="protection-row">
                    <span className={'protection-badge ' + item.protection}>{badgeLabel}</span>
                    <span>{item.label}</span>
                    {item.count > 1 && <span style={{fontSize:10,color:'var(--text-muted)'}}>×{item.count}</span>}
                    {item.auto && <span className="auto-tag">auto</span>}
                  </div>
                );
              })}
              {protectionSummary.length === 0 && <div className="detail-panel-empty">No protection required</div>}
            </div>
          </div>
        </div>
      </div>

    </div>
  );
}

// === SUBSTRATE STATE SELECTOR (shared) ===
function SubstrateStateSelect({ substrateId, value, onChange }) {
  const applicable = ENUMS.substrateStates.filter(s => s.applies_to.includes(substrateId));
  return <Sel options={applicable} value={value} onChange={v=>onChange(v||null)} placeholder="Select State..." />;
}

// === GENERIC SUBSTRATE DETAIL PANEL ===
// Handles most trim, simple surfaces, and specialty items
function SubstrateDetailPanel({ room, derived, dispatch, substrateId, project }) {
  const rid = room.id;
  const config = room.substrates[substrateId];
  if (!config) return null;
  const cat = SUBSTRATE_MAP[substrateId];
  if (!cat) return null;

  const setSub = (f,v) => dispatch({type:'SET_SUBSTRATE',payload:{roomId:rid,substrateId,field:f,value:v}});

  // Determine derived value and UOM
  const uom = cat.uom;
  const hasAuto = !!cat.autoDerive;
  const derivedKey = `${substrateId}_lf`; // most trim derives to XX_lf in derived
  let autoDerivedVal = 0;
  if (hasAuto) {
    // Look up the derived value by key convention
    const dKey = Object.keys(derived).find(k => k.startsWith(substrateId.replace(/_/g, '_')));
    if (dKey) autoDerivedVal = derived[dKey] || 0;
    else autoDerivedVal = cat.autoDerive({ perimeter:derived.perimeter, totalDoors:derived.totalDoors, totalWindows:derived.totalWindows, wall_field_sf:derived.wall_field_sf, ceiling_field_sf:derived.ceiling_field_sf }) || 0;
  }

  // For SF-based surfaces (walls, ceiling)
  const isSF = uom === 'SF' && (config.sf_override !== undefined || config.sf_manual !== undefined);
  // For LF-based substrates
  const isLF = uom === 'LF';
  // For EA-based substrates (specialty)
  const isEA = uom === 'EA' && config.ea_manual !== undefined;
  // For EA-auto (door_frames, window_jamb)
  const isEAAuto = uom === 'EA' && config.ea_manual === undefined;

  return (
    <div>
      <div className="panel-section">
        <div className="section-title">{cat.label} Details</div>
        <div className="form-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
          <div>
            <div className="field-label">Substrate State</div>
            <SubstrateStateSelect substrateId={substrateId} value={config.substrate_state} onChange={v=>setSub('substrate_state',v)} />
          </div>

          {/* Quality Tier per-substrate override */}
          <div>
            <div className="field-label">Quality Tier</div>
            <Sel options={ENUMS.qualityTiers} value={config.quality_tier || null} onChange={v=>setSub('quality_tier',v||null)} placeholder={`Project Default (${project?.default_quality_tier || 'QT3'})`} />
          </div>

          {/* Application Method per-substrate */}
          {config.application_method !== undefined && (() => {
            const sam = SUBSTRATE_APPLICATION_METHODS[substrateId];
            if (!sam) return null;
            const methodOptions = ENUMS.applicationMethods.filter(m => sam.methods.includes(m.value));
            return (
              <div>
                <div className="field-label">Application Method</div>
                <Sel options={methodOptions} value={config.application_method} onChange={v=>setSub('application_method',v||null)} placeholder={`Default (${sam.default})`} />
              </div>
            );
          })()}

          {/* Texture for walls/ceiling */}
          {config.texture !== undefined && (
            <div>
              <div className="field-label">Texture (null = project default)</div>
              <Sel options={ENUMS.textures} value={config.texture} onChange={v=>setSub('texture',v||null)} placeholder="Project Default" />
            </div>
          )}

          {/* Style for casing types */}
          {config.style !== undefined && (
            <div>
              <div className="field-label">Profile Style</div>
              <input value={config.style||''} onChange={e=>setSub('style',e.target.value||null)} style={{width:'100%'}} placeholder="e.g. Colonial, Craftsman" />
            </div>
          )}
        </div>
      </div>

      {/* Quantity section */}
      <div className="panel-section">
        <div className="section-title">Quantity ({uom})</div>

        {/* SF with override (walls, ceiling) */}
        {isSF && hasAuto && (
          <div>
            <NumField value={config.sf_manual||0} derived={Math.round(autoDerivedVal)} isOverride={!!config.sf_override}
              onValueChange={v=>setSub('sf_manual',v)} onOverrideToggle={v=>setSub('sf_override',v)} uom="SF" />
            {substrateId === 'walls' && <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>Gross {derived.wallGross} - Deduct {derived.openingDeduction} = Net {derived.wallNet}{derived.gableExtra > 0 ? ` + Gable ${derived.gableExtra}` : ''}</div>}
            {substrateId === 'ceiling' && <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>L×W = {derived.ceilingSF}{derived.vaultedExtra > 0 ? ` + Vault ${derived.vaultedExtra}` : ''}</div>}
          </div>
        )}

        {/* SF manual-only (specialty SF items) */}
        {isSF && !hasAuto && (
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <input type="number" value={config.sf_manual||0} onChange={e=>setSub('sf_manual',parseFloat(e.target.value)||0)} min="0" style={{width:100}} />
            <span style={{fontSize:11,color:'var(--text-muted)'}}>SF</span>
            <span className="badge badge-manual">manual</span>
          </div>
        )}

        {/* LF with auto-derive */}
        {isLF && hasAuto && (
          <div>
            <NumField value={config.lf_manual||0} derived={Math.round(autoDerivedVal)} isOverride={!!config.lf_override}
              onValueChange={v=>setSub('lf_manual',v)} onOverrideToggle={v=>setSub('lf_override',v)} uom="LF" />
          </div>
        )}

        {/* LF manual-only (chair rail, shoe mold, etc.) */}
        {isLF && !hasAuto && (
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <input type="number" value={config.lf_manual||0} onChange={e=>setSub('lf_manual',parseFloat(e.target.value)||0)} min="0" style={{width:100}} />
            <span style={{fontSize:11,color:'var(--text-muted)'}}>LF</span>
            <span className="badge badge-manual">manual</span>
          </div>
        )}

        {/* EA manual (specialty) */}
        {isEA && (
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <input type="number" value={config.ea_manual||0} onChange={e=>setSub('ea_manual',parseInt(e.target.value)||0)} min="0" style={{width:80}} />
            <span style={{fontSize:11,color:'var(--text-muted)'}}>EA</span>
            <span className="badge badge-manual">manual</span>
          </div>
        )}

        {/* EA auto-derived (door_frames, window_jamb) */}
        {isEAAuto && (
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:14,color:'var(--accent)'}}>{Math.round(autoDerivedVal)}</span>
            <span style={{fontSize:11,color:'var(--text-muted)'}}>EA (auto-derived)</span>
            <span className="badge badge-auto">auto</span>
          </div>
        )}
      </div>
    </div>
  );
}

// === DOORS PANEL (v0.3 — reads from substrates.doors.items) ===
function DoorsPanel({ room, dispatch }) {
  const rid = room.id;
  const items = room.substrates.doors?.items || [];
  // Filter substrate states applicable to doors
  const doorStates = ENUMS.substrateStates.filter(s => s.applies_to.includes('doors'));
  return (
    <div>
      <div className="panel-section">
        <div className="section-title">
          Door Slabs
          <button className="btn btn-sm btn-accent" onClick={()=>dispatch({type:'ADD_DOOR',payload:{roomId:rid}})}>+ Add Door</button>
        </div>
        {(() => {
          const sam = SUBSTRATE_APPLICATION_METHODS['doors'];
          const methodOptions = ENUMS.applicationMethods.filter(m => sam.methods.includes(m.value));
          const doorConfig = room.substrates.doors || {};
          return (
            <div style={{marginBottom:8}}>
              <span className="field-label" style={{marginRight:8}}>Application Method</span>
              <Sel options={methodOptions} value={doorConfig.application_method||null}
                onChange={v=>dispatch({type:'SET_SUBSTRATE',payload:{roomId:rid,substrateId:'doors',field:'application_method',value:v||null}})}
                placeholder={`Default (${sam.default})`} style={{width:180}} />
            </div>
          );
        })()}
        {items.length === 0 ? (
          <div style={{color:'var(--text-muted)',padding:12,textAlign:'center'}}>No doors. Click + Add Door.</div>
        ) : (
          <table className="data-table">
            <thead><tr><th>Count</th><th>Type</th><th>Substrate State</th><th>Sides</th><th>Total Sides</th><th></th></tr></thead>
            <tbody>
              {items.map(door => (
                <tr key={door.id}>
                  <td><input type="number" value={door.count} min="0" onChange={e=>dispatch({type:'SET_DOOR',payload:{roomId:rid,doorId:door.id,field:'count',value:parseInt(e.target.value)||0}})} style={{width:60}} /></td>
                  <td><Sel options={ENUMS.doorTypes} value={door.door_type} onChange={v=>dispatch({type:'SET_DOOR',payload:{roomId:rid,doorId:door.id,field:'door_type',value:v}})} /></td>
                  <td><Sel options={doorStates} value={door.substrate_state} onChange={v=>dispatch({type:'SET_DOOR',payload:{roomId:rid,doorId:door.id,field:'substrate_state',value:v}})} /></td>
                  <td><input type="number" value={door.sides_per_door} min="1" max="2" onChange={e=>dispatch({type:'SET_DOOR',payload:{roomId:rid,doorId:door.id,field:'sides_per_door',value:parseInt(e.target.value)||2}})} style={{width:50}} /></td>
                  <td style={{fontFamily:'var(--font-mono)',color:'var(--accent)'}}>{(parseInt(door.count)||0)*(parseInt(door.sides_per_door)||2)} EA_SIDE</td>
                  <td><button className="btn btn-sm btn-danger" onClick={()=>dispatch({type:'REMOVE_DOOR',payload:{roomId:rid,doorId:door.id}})}>&#x2715;</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

        </div>
        {(() => {
          const sam = SUBSTRATE_APPLICATION_METHODS['windows'];
          const methodOptions = ENUMS.applicationMethods.filter(m => sam.methods.includes(m.value));
          const winConfig = room.substrates.windows || {};
          return (
            <div style={{marginBottom:8}}>
              <span className="field-label" style={{marginRight:8}}>Application Method</span>

          );
        })()}
        {items.length === 0 ? (
          <div style={{color:'var(--text-muted)',padding:12,textAlign:'center'}}>No windows. Click + Add Window.</div>
        ) : (
          <table className="data-table">
            <thead><tr><th>Count</th><th>Type</th><th>Size Bucket</th><th>Substrate State</th><th>PS Key</th><th></th></tr></thead>
            <tbody>
              {items.map(win => (
                <tr key={win.id}>
                  <td><input type="number" value={win.count} min="0" onChange={e=>dispatch({type:'SET_WINDOW',payload:{roomId:rid,winId:win.id,field:'count',value:parseInt(e.target.value)||0}})} style={{width:60}} /></td>
                  <td><Sel options={ENUMS.windowTypes} value={win.window_type} onChange={v=>dispatch({type:'SET_WINDOW',payload:{roomId:rid,winId:win.id,field:'window_type',value:v}})} /></td>
                  <td><Sel options={ENUMS.windowSizes} value={win.size_bucket} onChange={v=>dispatch({type:'SET_WINDOW',payload:{roomId:rid,winId:win.id,field:'size_bucket',value:v}})} /></td>
                  <td><Sel options={winStates} value={win.substrate_state} onChange={v=>dispatch({type:'SET_WINDOW',payload:{roomId:rid,winId:win.id,field:'substrate_state',value:v}})} /></td>
                  <td style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--derived)'}}>PS_OPENING_EA.WINDOW_{win.size_bucket}</td>
                  <td><button className="btn btn-sm btn-danger" onClick={()=>dispatch({type:'REMOVE_WINDOW',payload:{roomId:rid,winId:win.id}})}>&#x2715;</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// === ROOM EDITOR (v0.4 — master/detail layout) ===
function RoomEditor({ room, project, dispatch }) {
  const [activeTab, setActiveTab] = useState('scope');
  const [focusedSubstrate, setFocusedSubstrate] = useState(null);
  const derived = useMemo(() => deriveRoom(room), [room]);
  const subs = room.substrates || {};

  // Clear focus if substrate was unchecked externally
  useEffect(() => {
    if (focusedSubstrate && !subs[focusedSubstrate]) setFocusedSubstrate(null);
  }, [subs, focusedSubstrate]);

  // Only Scope + conditional Doors/Windows tabs
  const allTabs = useMemo(() => {
    const tabs = [
      { key:'scope', label:'Scope & Configuration', badge: `${Object.keys(subs).length}` },
    ];
    if (subs.doors) tabs.push({ key:'doors', label:'Doors', badge: subs.doors?.items?.length ? `${derived.totalDoors}` : null, group:'Doors & Windows' });
    if (subs.windows) tabs.push({ key:'windows', label:'Windows', badge: subs.windows?.items?.length ? `${derived.totalWindows}` : null, group:'Doors & Windows' });
    return tabs;
  }, [subs, derived]);

  // If active tab is no longer valid, fall back to scope
  const validTabKeys = allTabs.map(t => t.key);
  const safeActiveTab = validTabKeys.includes(activeTab) ? activeTab : 'scope';

  function renderPanel() {
    if (safeActiveTab === 'scope') return <ScopePanel room={room} derived={derived} dispatch={dispatch} project={project} focusedSubstrate={focusedSubstrate} setFocusedSubstrate={setFocusedSubstrate} />;
    if (safeActiveTab === 'doors') return <DoorsPanel room={room} dispatch={dispatch} />;
    if (safeActiveTab === 'windows') return <WindowsPanel room={room} dispatch={dispatch} />;
    return null;
  }

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div className="tab-bar" style={{flexWrap:'wrap'}}>
        {allTabs.map(t => {
          const groupColors = {'Doors & Windows':'#ffb74d'};
          const tabStyle = t.group ? {borderBottom:safeActiveTab===t.key?`2px solid ${groupColors[t.group]||'var(--accent)'}`:undefined} : {};
          return (
            <div key={t.key} className={`tab ${safeActiveTab===t.key?'active':''}`} onClick={()=>setActiveTab(t.key)} style={tabStyle}>
              {t.label} {t.badge && <span className="badge-count">{t.badge}</span>}
            </div>
          );
        })}
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'16px 20px'}}>
        {renderPanel()}
      </div>
    </div>
  );
}

// === PROJECT SUMMARY ===
function ProjectSummary({ state }) {
  const exported = useMemo(() => exportProject(state), [state]);

  // Determine winning floor protection scope from active substrates
  const winningFloorKey = useMemo(() => {
    const hasFullCover = state.rooms.some(r => {
      const subs = r.substrates || {};
      return subs.walls || subs.ceilings;
    });
    if (hasFullCover) return 'PS_PROTECT_SF.FLOOR_EXPOSED';
    const hasWorkzone = state.rooms.some(r => {
      const subs = r.substrates || {};
      return subs.doors || subs.windows || subs.door_frames || subs.window_jamb;
    });
    if (hasWorkzone) return 'PS_PROTECT_SF.FLOOR_WORKZONE';
    return 'PS_PROTECT_SF.FLOOR_PERIMETER';
  }, [state.rooms]);

  const qtyByCategory = useMemo(() => {
    const suppressed = new Set([
      'PS_PROTECT_SF.FLOOR_EXPOSED', 'PS_PROTECT_SF.FLOOR_WORKZONE', 'PS_PROTECT_SF.FLOOR_PERIMETER'
    ]);
    suppressed.delete(winningFloorKey); // keep only the winning floor key
    const cats = {};
    exported.ps_quantities.forEach(q => {
      if (suppressed.has(q.quantity_key)) return;
      const prefix = q.quantity_key.split('.')[0];
      if (!cats[prefix]) cats[prefix] = [];
      cats[prefix].push(q);
    });
    return cats;
  }, [exported, winningFloorKey]);

  const catLabels = {
    'PS_SURFACE_SF': 'Surface Area (SF)',
    'PS_SURFACE_LF': 'Surface Linear (LF)',
    'PS_SURFACE_EA': 'Surface Count (EA)',
    'PS_SURFACE_EA_SIDE': 'Surface Sides (EA_SIDE)',
    'PS_EDGE_LF': 'Edges (LF)',
    'PS_OPENING_EA': 'Openings (EA)',
    'PS_META': 'Meta / Routing',
    'PS_PROTECT_SF': 'Protection Area (SF)',
    'PS_PROTECT_LF': 'Protection Linear (LF)',
    'PS_PROTECT_EA': 'Protection Count (EA)',
  };

  return (
    <div>
      <h2 style={{fontSize:16,marginBottom:4,color:'var(--accent)'}}>Project Summary: {state.project.name || 'Untitled'}</h2>
      <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:16}}>
        {state.rooms.length} rooms | {exported._meta.total_wall_sf} SF wall | {exported._meta.total_ceiling_sf} SF ceiling | {exported.ps_quantities.length} quantity keys
      </div>

      <div className="panel-section">
        <div className="section-title">Room Breakdown</div>
        <table className="data-table">
          <thead><tr><th>Room</th><th>Area Group</th><th>Dims</th><th>Wall SF</th><th>Ceiling SF</th><th>Doors</th><th>Windows</th><th>Substrates</th><th>QT</th></tr></thead>
          <tbody>
            {state.rooms.map(room => {
              const d = deriveRoom(room);
              const subCount = Object.keys(room.substrates||{}).length;
              return (
                <tr key={room.id}>
                  <td style={{fontWeight:500}}>{room.label}</td>
                  <td style={{color:'var(--text-muted)'}}>{room.area_group||'—'}</td>
                  <td style={{fontFamily:'var(--font-mono)'}}>{d.L}×{d.W}×{d.H}</td>
                  <td style={{fontFamily:'var(--font-mono)',color:'var(--accent)'}}>{d.wall_field_sf}</td>
                  <td style={{fontFamily:'var(--font-mono)',color:'var(--accent)'}}>{d.ceiling_field_sf}</td>
                  <td style={{fontFamily:'var(--font-mono)'}}>{d.totalDoors}</td>
                  <td style={{fontFamily:'var(--font-mono)'}}>{d.totalWindows}</td>
                  <td style={{fontSize:11,color:'var(--text-secondary)'}}>{subCount > 0 ? Object.keys(room.substrates).map(s => SUBSTRATE_MAP[s]?.label || s).join(', ') : '—'}</td>
                  <td>{state.project.default_quality_tier} <span style={{fontSize:10,color:'var(--text-muted)'}}>({d.heightBand})</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="summary-grid">
        {Object.entries(qtyByCategory).map(([cat, items]) => (
          <div key={cat} className="summary-card">
            <div className="summary-card-title">{catLabels[cat] || cat}</div>
            {items.map(q => (
              <div key={q.quantity_key} className="summary-row">
                <span style={{fontFamily:'var(--font-mono)',fontSize:11}}>{q.quantity_key}</span>
                <span className="summary-value">{q.value !== null ? q.value : q.text_value} {q.uom}</span>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// === JSON EXPORT/IMPORT ===
function JsonExportView({ state, dispatch }) {
  const [toast, setToast] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState('');
  const exported = useMemo(() => exportProject(state), [state]);
  const jsonStr = useMemo(() => JSON.stringify(exported, null, 2), [exported]);

  const copyToClipboard = () => {
    navigator.clipboard.writeText(jsonStr).then(() => {
      setToast('Copied to clipboard!'); setTimeout(()=>setToast(null), 2000);
    });
  };

  const download = () => {
    const blob = new Blob([jsonStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${state.project.name || 'paintscope'}_scope.json`;
    a.click();
    URL.revokeObjectURL(url);
    setToast('Downloaded!'); setTimeout(()=>setToast(null), 2000);
  };

  const handleImport = () => {
    try {
      const data = JSON.parse(importText);
      // Reconstruct state from exported JSON
      if (data._meta && data._meta.tool === 'PaintScope Prototype') {
        // It's a raw state export — try to load
        setToast('Imported (external format) — manual mapping needed');
      }
      // Try loading as internal state (with v0.2→v0.3 migration)
      if (data.project && data.rooms) {
        const migrated = migrateV02toV03(data);
        dispatch({type:'IMPORT_PROJECT', payload:migrated});
        setShowImport(false);
        setToast('Project imported!'); setTimeout(()=>setToast(null), 2000);
        return;
      }
      setToast('Unrecognized format'); setTimeout(()=>setToast(null), 3000);
    } catch(e) {
      setToast('Invalid JSON: ' + e.message); setTimeout(()=>setToast(null), 3000);
    }
  };

  const exportInternalState = () => {
    const blob = new Blob([JSON.stringify({ project:state.project, rooms:state.rooms, ui:state.ui }, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${state.project.name || 'paintscope'}_state.json`;
    a.click();
    URL.revokeObjectURL(url);
    setToast('State exported for re-import!'); setTimeout(()=>setToast(null), 2000);
  };

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <h2 style={{fontSize:16,color:'var(--accent)'}}>JSON Export</h2>
        <div className="btn-group">
          <button className="btn btn-accent" onClick={copyToClipboard}>Copy JSON</button>
          <button className="btn btn-success" onClick={download}>Download .json</button>
          <button className="btn" onClick={exportInternalState}>Save State (re-importable)</button>
          <button className="btn" onClick={()=>setShowImport(true)}>Import State...</button>
        </div>
      </div>
      <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:8}}>
        {exported.ps_quantities.length} quantity keys | {exported.ps_surfaces.length} surfaces | {exported.ps_assets.length} assets | {exported.ps_edges.length} edges
      </div>
      <div className="json-view">{jsonStr}</div>
      {toast && <div className="toast">{toast}</div>}
      {showImport && (
        <div className="modal-overlay" onClick={()=>setShowImport(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-title">Import Project State</div>
            <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:8}}>Paste a previously saved state JSON (from "Save State" button):</div>
            <textarea value={importText} onChange={e=>setImportText(e.target.value)} rows={12} style={{width:'100%',fontFamily:'var(--font-mono)',fontSize:11}} placeholder='Paste JSON here...' />
            <div className="btn-group" style={{marginTop:8}}>
              <button className="btn btn-accent" onClick={handleImport}>Import</button>
              <button className="btn" onClick={()=>setShowImport(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// === ESTIMATE VIEW ===
function EstimateView({ state }) {
  const estimate = useMemo(() => {
    try { return runEstimate(state, DB_BUNDLE); }
    catch(e) { console.error('Estimate error:', e); return null; }
  }, [state]);

  const [expandedRooms, setExpandedRooms] = useState({});
  const [expandedItems, setExpandedItems] = useState({});

  // Task name suffix: adds coat count and/or floor protection material
  const taskNameSuffix = (t) => {
    const parts = [];
    if (t.coatMultiplier > 1) parts.push(`${t.coatMultiplier} coats`);
    if (t.floorType && t.taskName && t.taskName.toLowerCase().includes('floor prot') && FLOOR_PROTECTION_LABEL[t.floorType]) {
      parts.push(`${FLOOR_PROTECTION_LABEL[t.floorType]} \u2014 ${(FLOOR_TYPES.find(f=>f.id===t.floorType)||{}).label||t.floorType}`);
    }
    return parts.length > 0 ? ` (${parts.join(', ')})` : '';
  };

  if (!estimate) return <div className="no-data-msg">Error running estimate. Check console for details.</div>;
  if (estimate.specResults.length === 0) return (
    <div className="no-data-msg">
      <div style={{fontSize:18,marginBottom:8}}>No Specs Activated</div>
      <div>Add rooms with geometry (wall SF, doors, trim, etc.) to activate specs.</div>
      <div style={{marginTop:8,fontSize:12}}>The engine checks {DB_BUNDLE.spec_families.length} spec families against your project's PaintScope quantity keys.</div>
    </div>
  );

  const toggleRoom = (id) => setExpandedRooms(p => ({...p, [id]: !p[id]}));
  const toggleItem = (id) => setExpandedItems(p => ({...p, [id]: !p[id]}));

  const projCtx = {
    quality_tier: state.project.default_quality_tier,
    complexity: state.project.default_complexity,
    texture: state.project.default_texture
  };

  // Build room-grouped structure: room -> spec (paintable item) -> tasks
  const allTasks = estimate.specResults.flatMap(s =>
    s.tasks.map(t => ({...t, specId: s.specId, specName: s.specName, itemGroup: s.itemGroup || null}))
  );

  const roomMap = {};
  allTasks.forEach(t => {
    const ri = t.roomIndex;
    const specKey = t.itemGroup ? `${t.specId}::${t.itemGroup}` : t.specId;
    if (!roomMap[ri]) roomMap[ri] = { label: t.roomLabel, specs: {}, totalHours: 0 };
    if (!roomMap[ri].specs[specKey]) roomMap[ri].specs[specKey] = { specName: t.specName, tasks: [], totalHours: 0, phaseHours: {} };
    roomMap[ri].specs[specKey].tasks.push(t);
    roomMap[ri].specs[specKey].totalHours += t.hours;
    const p = t.phase || 'apply';
    roomMap[ri].specs[specKey].phaseHours[p] = (roomMap[ri].specs[specKey].phaseHours[p] || 0) + t.hours;
    roomMap[ri].totalHours += t.hours;
  });

  // Add room protection hours to room totals
  if (estimate.roomProtection) {
    Object.entries(estimate.roomProtection).forEach(([ri, rp]) => {
      if (roomMap[ri]) roomMap[ri].totalHours += rp.totalHours;
    });
  }

  const roomEntries = Object.entries(roomMap).sort((a,b) => parseInt(a[0]) - parseInt(b[0]));

  return (
    <div>
      <div className="estimate-header">
        <h2>Estimate {state.project.name && ` \u2014 ${state.project.name}`}</h2>
        <div className="estimate-totals">
          <div><span className="big-num">{estimate.totalHours}</span><span className="unit">hrs</span></div>
          <div><span className="big-num">{estimate.totalCrewDays}</span><span className="unit">crew days</span><span style={{fontSize:11,color:'var(--text-muted)',marginLeft:4}}>(@ 8hr, 2 crew)</span></div>
          <div style={{color:'var(--text-secondary)',alignSelf:'center'}}>{estimate.activatedSpecs}/{estimate.totalSpecs} specs activated | {state.rooms.length} rooms</div>
        </div>
      </div>

      <div className="modifier-summary">
        <div className="mod-chip"><span className="mod-label">QT:</span><span className="mod-val">{projCtx.quality_tier}</span></div>
        <div className="mod-chip"><span className="mod-label">Texture:</span><span className="mod-val">{projCtx.texture}</span></div>
        <div className="mod-chip"><span className="mod-label">Complexity:</span><span className="mod-val">{projCtx.complexity}</span></div>
      </div>

      {estimate.warnings.length > 0 && (
        <details className="warn-panel">
          <summary>{estimate.warnings.length} warning{estimate.warnings.length>1?'s':''}</summary>
          <ul>{estimate.warnings.map((w,i) => <li key={i}>{w}</li>)}</ul>
        </details>
      )}

      {roomEntries.map(([ri, roomData]) => {
        const room = state.rooms[parseInt(ri)];
        const d = room ? deriveRoom(room) : null;
        const isRoomOpen = expandedRooms[ri] !== false;
        const specEntries = Object.entries(roomData.specs).sort((a,b) => b[1].totalHours - a[1].totalHours);

        return (
          <div key={ri} className="wo-room-group" style={{marginBottom:16}}>
            <div className="wo-room-title" onClick={() => toggleRoom(ri)} style={{cursor:'pointer'}}>
              <span style={{marginRight:8,display:'inline-block',transform:isRoomOpen?'rotate(90deg)':'rotate(0)',transition:'transform 0.15s',fontSize:12}}>{'\u25B6'}</span>
              {roomData.label}
              {d && <span className="wo-room-dims">{d.L}x{d.W}x{d.H} | {d.wall_field_sf} SF wall | {d.ceiling_field_sf} SF ceil</span>}
              <span style={{float:'right',color:'var(--accent)',fontFamily:'var(--font-mono)',fontWeight:700}}>{roomData.totalHours.toFixed(1)} hrs</span>
            </div>

            {isRoomOpen && estimate.roomProtection && estimate.roomProtection[ri] && (() => {
              const rp = estimate.roomProtection[ri];
              const rpKey = ri + '::__ROOM_PROTECTION__';
              const isRpOpen = expandedItems[rpKey];
              const levelLabel = (rp.protectionLevel || 'edge_only').replace(/_/g, ' ');
              return (
                <div className="spec-section" style={{marginLeft:16,borderLeft:'3px solid #e6a817',paddingLeft:12,marginBottom:8}}>
                  <div className="spec-header" onClick={() => toggleItem(rpKey)} style={{cursor:'pointer',padding:'6px 0'}}>
                    <span style={{marginRight:6,display:'inline-block',transform:isRpOpen?'rotate(90deg)':'rotate(0)',transition:'transform 0.15s',fontSize:10}}>{'\u25B6'}</span>
                    <span style={{fontWeight:700,color:'#e6a817'}}>Room Protection</span>
                    <span style={{fontSize:11,color:'var(--text-muted)',marginLeft:8,textTransform:'capitalize'}}>{levelLabel}</span>
                    <span className="spec-hours" style={{float:'right',fontFamily:'var(--font-mono)'}}>{rp.totalHours.toFixed(2)} hrs</span>
                  </div>
                  {isRpOpen && (
                    <div className="task-detail" style={{marginLeft:16}}>
                      <table className="task-table">
                        <thead><tr><th>Task</th><th>Phase</th><th>Source Spec</th><th style={{textAlign:'right'}}>Qty</th><th style={{textAlign:'right'}}>Rate</th><th style={{textAlign:'right'}}>Hours</th></tr></thead>
                        <tbody>
                          {rp.tasks.map((t, i) => (
                            <tr key={i} style={{background: PHASE_COLORS[t.phase] || 'transparent'}}>
                              <td className="task-name-col">{t.taskName}{taskNameSuffix(t)}</td>
                              <td style={{fontSize:11,color:'var(--text-muted)',textTransform:'capitalize'}}>{t.phase}</td>
                              <td style={{fontSize:10,color:'var(--derived)'}}>{specDisplayName(t.donorSpecId)}</td>
                              <td style={{textAlign:'right'}}>{t.isFixed ? '\u2014' : t.quantity}</td>
                              <td style={{textAlign:'right',color:'var(--text-muted)'}}>{t.baseRate}</td>
                              <td style={{textAlign:'right',color:'var(--accent)',fontWeight:600}}>
                                {t.hours.toFixed(2)}
                                {t.coatMultiplier > 1 && <span style={{fontSize:9,color:'var(--text-muted)',marginLeft:3}}>×{t.coatMultiplier}</span>}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              );
            })()}

            {isRoomOpen && specEntries.map(([specId, specData]) => {
              const itemKey = `${ri}::${specId}`;
              const isItemOpen = expandedItems[itemKey];
              const displayName = specData.specName || specDisplayName(specId);

              return (
                <div key={specId} className="spec-section" style={{marginLeft:16,borderLeft:'3px solid var(--border)',paddingLeft:12,marginBottom:8}}>
                  <div className="spec-header" onClick={() => toggleItem(itemKey)} style={{cursor:'pointer',padding:'6px 0'}}>
                    <span style={{marginRight:6,display:'inline-block',transform:isItemOpen?'rotate(90deg)':'rotate(0)',transition:'transform 0.15s',fontSize:10}}>{'\u25B6'}</span>
                    <span className="spec-name" style={{fontWeight:600}}>{displayName}<span style={{color:'var(--text-muted)',fontWeight:400,marginLeft:8,fontSize:11}}>{specId.split('::')[0]}</span></span>
                    <span className="spec-hours" style={{float:'right',fontFamily:'var(--font-mono)'}}>{specData.totalHours.toFixed(2)} hrs</span>
                  </div>
                  <div className="phase-bar" style={{marginLeft:16}}>
                    {PHASE_ORDER.filter(p => specData.phaseHours[p]).map(p => (
                      <div key={p} className="phase-chip">
                        <span className="phase-label">{p}</span>
                        <span className="phase-hrs">{specData.phaseHours[p].toFixed(1)}h</span>
                      </div>
                    ))}
                  </div>
                  {isItemOpen && (
                    <div className="task-detail" style={{marginLeft:16}}>
                      <table className="task-table">
                        <thead><tr><th>Task</th><th>Phase</th><th>PS Key</th><th>UOM</th><th style={{textAlign:'right'}}>Qty</th><th style={{textAlign:'right'}}>Rate</th><th style={{textAlign:'right'}}>Mod</th><th style={{textAlign:'right'}}>Hours</th></tr></thead>
                        <tbody>
                          {specData.tasks.map((t, i) => (
                            <tr key={i} style={{background: PHASE_COLORS[t.phase] || 'transparent'}}>
                              <td className="task-name-col" title={t.taskName}>{t.taskName}{taskNameSuffix(t)}</td>
                              <td style={{fontSize:11,color:'var(--text-muted)',textTransform:'capitalize'}}>{t.phase}</td>
                              <td style={{fontSize:10,color:'var(--derived)'}}>{t.psKey}</td>
                              <td style={{fontSize:11}}>{t.uom}</td>
                              <td style={{textAlign:'right'}}>{t.isFixed ? '\u2014' : t.quantity}</td>
                              <td style={{textAlign:'right',color:'var(--text-muted)'}}>{t.baseRate}</td>

                                    t.modStack.height !== 1 && `Ht:${t.modStack.height}`,
                                    t.modStack.sizeMod && t.modStack.sizeMod !== 1 && `Size:${t.modStack.sizeMod}`,
                                    t.modStack.typeMod && t.modStack.typeMod !== 1 && `Type:${t.modStack.typeMod}`
                                  ].filter(Boolean).join(' × ') || 'No modifiers'}>{t.modStack.total.toFixed(2)}x</td>
                              <td style={{textAlign:'right',color:'var(--accent)',fontWeight:600}}
                                  title={t.coatMultiplier > 1 ? `${(t.hours / t.coatMultiplier).toFixed(2)} hrs × ${t.coatMultiplier} coats` : ''}>
                                {t.hours.toFixed(2)}
                                {t.coatMultiplier > 1 && <span style={{fontSize:9,color:'var(--text-muted)',marginLeft:3}}>×{t.coatMultiplier}</span>}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}

      {estimate.materialEstimates.length > 0 && (
        <div className="material-section">
          <h3>Material Estimates</h3>
          {estimate.materialEstimates.map((m, i) => (
            <div key={i} className="mat-row">
              <span className="mat-name">{m.systemName || m.specFamilyId}{m.surfaceTexture ? ` (${m.surfaceTexture})` : ''}</span>
              <span className="mat-qty">{m.gallons} gal <span style={{color:'var(--text-muted)',fontSize:11}}>({m.totalSF} SF \u00d7 {m.coats || 1} coat{(m.coats||1)>1?'s':''} @ {m.coverageRate} SF/gal{m.sprayLoss ? ' +5% spray' : ''})</span></span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// === WORK ORDER VIEW ===
function WorkOrderView({ state }) {
  const estimate = useMemo(() => {
    try { return runEstimate(state, DB_BUNDLE); }
    catch(e) { console.error('WorkOrder error:', e); return null; }
  }, [state]);

  const [viewMode, setViewMode] = useState('room'); // 'phase' or 'room'
  const [expandedRooms, setExpandedRooms] = useState({});
  const [expandedItems, setExpandedItems] = useState({});

  if (!estimate || estimate.specResults.length === 0) return (
    <div className="no-data-msg">No tasks to display. Run the Estimate view first to verify specs activate.</div>
  );

  const toggleRoom = (id) => setExpandedRooms(p => ({...p, [id]: !p[id]}));
  const toggleItem = (id) => setExpandedItems(p => ({...p, [id]: !p[id]}));

  // Flatten all tasks
  const allTasks = estimate.specResults.flatMap(s => s.tasks.map(t => ({...t, specId: s.specId, specName: s.specName, itemGroup: s.itemGroup || null})));

  // Merge room protection tasks into allTasks for phase-based views
  if (estimate.roomProtection) {
    Object.entries(estimate.roomProtection).forEach(([ri, rp]) => {
      rp.tasks.forEach(t => {
        allTasks.push({...t, specId: '__ROOM_PROTECTION__', specName: 'Room Protection'});
      });
    });
  }

  // Phase-grouped view
  const byPhase = {};
  PHASE_ORDER.forEach(p => { byPhase[p] = []; });
  allTasks.forEach(t => {
    const phase = t.phase || 'apply';
    if (!byPhase[phase]) byPhase[phase] = [];
    byPhase[phase].push(t);
  });

  // Room -> Paintable Item grouped view
  const roomMap = {};
  allTasks.forEach(t => {
    const ri = t.roomIndex;
    const specKey = t.itemGroup ? `${t.specId}::${t.itemGroup}` : t.specId;
    if (!roomMap[ri]) roomMap[ri] = { label: t.roomLabel, specs: {}, totalHours: 0 };
    if (!roomMap[ri].specs[specKey]) roomMap[ri].specs[specKey] = { specName: t.specName, tasks: [], totalHours: 0 };
    roomMap[ri].specs[specKey].tasks.push(t);
    roomMap[ri].specs[specKey].totalHours += t.hours;
    roomMap[ri].totalHours += t.hours;
  });

  // Add room protection hours to room totals
  if (estimate.roomProtection) {
    Object.entries(estimate.roomProtection).forEach(([ri, rp]) => {
      if (roomMap[ri]) roomMap[ri].totalHours += rp.totalHours;
    });
  }

  const roomEntries = Object.entries(roomMap).sort((a,b) => parseInt(a[0]) - parseInt(b[0]));

  // Task name suffix helper: adds coat count and/or floor protection material
  const taskNameSuffix = (t) => {
    const parts = [];
    if (t.coatMultiplier > 1) parts.push(`${t.coatMultiplier} coats`);
    if (t.floorType && t.taskName && t.taskName.toLowerCase().includes('floor prot') && FLOOR_PROTECTION_LABEL[t.floorType]) {
      parts.push(`${FLOOR_PROTECTION_LABEL[t.floorType]} \u2014 ${(FLOOR_TYPES.find(f=>f.id===t.floorType)||{}).label||t.floorType}`);
    }
    return parts.length > 0 ? ` (${parts.join(', ')})` : '';
  };

  const TaskRow = ({ t, showRoom }) => (
    <div className="wo-task-row" style={{background: PHASE_COLORS[t.phase] || 'transparent'}}>
      <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={t.taskName}>{t.taskName}{taskNameSuffix(t)}</div>
      {showRoom ? (
        <div style={{fontSize:11,color:'var(--text-muted)',overflow:'hidden',textOverflow:'ellipsis'}}>{t.roomLabel}</div>
      ) : (
        <div style={{fontSize:11,color:'var(--text-muted)',textTransform:'capitalize'}}>{t.phase}</div>
      )}
      <div className="wo-qty">{t.isFixed ? '\u2014' : `${t.quantity} ${t.uom}`}</div>
      <div className="wo-rate">{t.isFixed ? t.baseRate : t.baseRate}</div>
      <div>{t.skillLevel && <span className={`wo-skill ${t.skillLevel}`}>{t.skillLevel}</span>}</div>
      <div className="wo-hrs">{t.hours.toFixed(2)}{t.coatMultiplier > 1 && <span style={{fontSize:9,color:'var(--text-muted)',marginLeft:2}}>×{t.coatMultiplier}</span>}</div>
    </div>
  );

  const TaskHeader = ({ secondCol }) => (
    <div className="wo-task-row header">
      <div>Task</div><div>{secondCol || 'Phase'}</div><div style={{textAlign:'right'}}>Qty</div><div style={{textAlign:'right'}}>Rate</div><div style={{textAlign:'center'}}>Skill</div><div style={{textAlign:'right'}}>Hours</div>
    </div>
  );

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <h2 style={{fontSize:16,color:'var(--accent)'}}>Work Order {state.project.name && ` \u2014 ${state.project.name}`}</h2>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div className="wo-toggle">
            <button className={`wo-toggle-btn ${viewMode==='room'?'active':''}`} onClick={()=>setViewMode('room')}>By Room</button>
            <button className={`wo-toggle-btn ${viewMode==='phase'?'active':''}`} onClick={()=>setViewMode('phase')}>By Phase</button>
          </div>
          <button className="btn btn-sm" onClick={()=>window.print()}>Print</button>
        </div>
      </div>

      <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:12}}>
        {allTasks.length} tasks | {estimate.totalHours} total hours | {estimate.totalCrewDays} crew days
      </div>

      {viewMode === 'phase' && (
        <div>
          {PHASE_ORDER.filter(p => byPhase[p] && byPhase[p].length > 0).map(phase => {
            const tasks = byPhase[phase];
            const phaseTotal = tasks.reduce((s,t) => s + t.hours, 0);
            return (
              <div key={phase} className="wo-phase-group">
                <div className="wo-phase-title">{phase} <span style={{fontWeight:400,fontSize:12,textTransform:'none'}}>({tasks.length} tasks, {phaseTotal.toFixed(1)} hrs)</span></div>
                <TaskHeader secondCol="Room" />
                {tasks.map((t,i) => <TaskRow key={i} t={t} showRoom={true} />)}
                <div className="section-total">
                  <span>Phase Total:</span>
                  <span className="total-hrs">{phaseTotal.toFixed(2)} hrs</span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {viewMode === 'room' && (
        <div>
          {roomEntries.map(([ri, roomData]) => {
            const room = state.rooms[parseInt(ri)];
            const d = room ? deriveRoom(room) : null;
            const isRoomOpen = expandedRooms[ri] !== false;
            const specEntries = Object.entries(roomData.specs).sort((a,b) => b[1].totalHours - a[1].totalHours);

            return (
              <div key={ri} className="wo-room-group">
                <div className="wo-room-title" onClick={() => toggleRoom(ri)} style={{cursor:'pointer'}}>
                  <span style={{marginRight:8,display:'inline-block',transform:isRoomOpen?'rotate(90deg)':'rotate(0)',transition:'transform 0.15s',fontSize:12}}>{'\u25B6'}</span>
                  {roomData.label}
                  {d && <span className="wo-room-dims">{d.L}x{d.W}x{d.H} | {d.wall_field_sf} SF wall | {d.ceiling_field_sf} SF ceil</span>}
                  <span style={{float:'right',color:'var(--accent)',fontFamily:'var(--font-mono)',fontWeight:700}}>{roomData.totalHours.toFixed(1)} hrs</span>
                </div>

                {isRoomOpen && estimate.roomProtection && estimate.roomProtection[ri] && (() => {
                  const rp = estimate.roomProtection[ri];
                  const rpKey = 'wo::' + ri + '::__RP__';
                  const isRpOpen = expandedItems[rpKey] !== false;
                  const levelLabel = (rp.protectionLevel || 'edge_only').replace(/_/g, ' ');
                  return (
                    <div style={{marginLeft:16,borderLeft:'3px solid #e6a817',paddingLeft:12,marginBottom:8}}>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 0',cursor:'pointer'}} onClick={() => toggleItem(rpKey)}>
                        <div>
                          <span style={{marginRight:6,display:'inline-block',transform:isRpOpen?'rotate(90deg)':'rotate(0)',transition:'transform 0.15s',fontSize:10}}>{'\u25B6'}</span>
                          <span style={{fontWeight:700,fontSize:13,color:'#e6a817'}}>Room Protection</span>
                          <span style={{color:'var(--text-muted)',fontSize:11,marginLeft:8,textTransform:'capitalize'}}>{levelLabel} | {rp.tasks.length} tasks</span>
                        </div>
                        <span style={{fontFamily:'var(--font-mono)',fontWeight:700,color:'var(--accent)'}}>{rp.totalHours.toFixed(2)} hrs</span>
                      </div>
                      {isRpOpen && (
                        <div style={{marginLeft:16}}>
                          <TaskHeader secondCol="Phase" />
                          {rp.tasks.map((t,i) => <TaskRow key={'rp'+i} t={{...t, specId: '__RP__', specName: 'Room Protection'}} showRoom={false} />)}
                        </div>
                      )}
                    </div>
                  );
                })()}

                {isRoomOpen && specEntries.map(([specId, specData]) => {
                  const itemKey = `wo::${ri}::${specId}`;
                  const isItemOpen = expandedItems[itemKey] !== false;
                  const displayName = specData.specName || specDisplayName(specId);
                  // Group tasks by phase within this item
                  const itemByPhase = {};
                  specData.tasks.forEach(t => {
                    const p = t.phase || 'apply';
                    if (!itemByPhase[p]) itemByPhase[p] = [];
                    itemByPhase[p].push(t);
                  });

                  return (
                    <div key={specId} style={{marginLeft:16,borderLeft:'3px solid var(--border)',paddingLeft:12,marginBottom:8}}>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 0',cursor:'pointer'}} onClick={() => toggleItem(itemKey)}>
                        <div>
                          <span style={{marginRight:6,display:'inline-block',transform:isItemOpen?'rotate(90deg)':'rotate(0)',transition:'transform 0.15s',fontSize:10}}>{'\u25B6'}</span>
                          <span style={{fontWeight:600,fontSize:13}}>{displayName}</span>
                          <span style={{color:'var(--text-muted)',fontSize:11,marginLeft:8}}>{specData.tasks.length} tasks</span>
                        </div>
                        <span style={{fontFamily:'var(--font-mono)',fontWeight:700,color:'var(--accent)'}}>{specData.totalHours.toFixed(2)} hrs</span>
                      </div>

                      {isItemOpen && (
                        <div style={{marginLeft:16}}>
                          {PHASE_ORDER.filter(p => itemByPhase[p]).map(phase => (
                            <div key={phase} style={{marginBottom:4}}>
                              <div style={{fontSize:11,color:'var(--text-muted)',textTransform:'uppercase',padding:'2px 0',fontWeight:600}}>{phase}</div>
                              <TaskHeader secondCol="Phase" />
                              {itemByPhase[phase].map((t,i) => <TaskRow key={i} t={t} showRoom={false} />)}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}

                <div className="section-total">
                  <span>Room Total:</span>
                  <span className="total-hrs">{roomData.totalHours.toFixed(2)} hrs</span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="section-total" style={{borderTop:'3px solid var(--accent)',marginTop:16}}>
        <span style={{fontSize:14}}>Grand Total:</span>
        <span className="total-hrs" style={{fontSize:16}}>{estimate.totalHours} hrs</span>
        <span style={{color:'var(--text-muted)'}}>({estimate.totalCrewDays} crew days)</span>
      </div>
    </div>
  );
}

// === MAIN APP ===
// ============================================================
// MIGRATION: v0.2 → v0.3
// ============================================================
function migrateV02toV03(state) {
  if (!state || !state.rooms) return state;
  // Check if already v0.3: rooms have substrates object
  const needsMigration = state.rooms.some(r => r.drywall || r.trim || (r.doors && !r.substrates));
  if (!needsMigration) return state;

  console.log('[PaintScope] Migrating saved state from v0.2 to v0.3...');
  const migrated = JSON.parse(JSON.stringify(state));

  migrated.rooms = migrated.rooms.map(room => {
    if (room.substrates) return room; // Already v0.3

    const subs = {};

    // Migrate drywall → walls + ceiling
    if (room.drywall) {
      subs.walls = {
        substrate_state: null, texture: room.drywall.texture || null,
        sf_override: !!room.drywall.wall_field_override,
        sf_manual: parseFloat(room.drywall.wall_field_sf) || 0
      };
      subs.ceiling = {
        substrate_state: null, texture: room.drywall.texture || null,
        sf_override: !!room.drywall.ceiling_field_override,
        sf_manual: parseFloat(room.drywall.ceiling_field_sf) || 0
      };
    }

    // Migrate trim
    if (room.trim) {
      if (room.trim.baseboard_enabled) subs.baseboard = { substrate_state: null, lf_override: !!room.trim.baseboard_override, lf_manual: parseFloat(room.trim.baseboard_lf)||0 };
      if (room.trim.crown_enabled) subs.crown = { substrate_state: null, lf_override: !!room.trim.crown_override, lf_manual: parseFloat(room.trim.crown_lf)||0 };
      // Casing auto-included if doors/windows exist
      if ((room.doors||[]).length > 0) subs.door_casing = { substrate_state: null, style: null, lf_override: !!room.trim.door_casing_override, lf_manual: parseFloat(room.trim.door_casing_lf)||0 };
      if ((room.windows||[]).length > 0) subs.window_casing = { substrate_state: null, style: null, lf_override: !!room.trim.window_casing_override, lf_manual: parseFloat(room.trim.window_casing_lf)||0 };

      // Optional trim items
      ['chair_rail','shoe_mold','wainscot_cap','picture_rail','window_stool','window_apron','shadow_box','panel_mold'].forEach(key => {
        if (room.trim[`${key}_enabled`]) subs[key] = { substrate_state: null, lf_manual: parseFloat(room.trim[`${key}_lf`])||0 };
      });
    }

    // Migrate doors → substrates.doors.items
    if (room.doors && room.doors.length > 0) {
      subs.doors = {
        items: room.doors.map(d => ({
          id: d.id, count: d.count, door_type: d.door_type,
          substrate_state: d.substrate || d.substrate_state || 'factory_primed',
          sides_per_door: d.sides_per_door || 2
        }))
      };
    }

    // Migrate windows → substrates.windows.items
    if (room.windows && room.windows.length > 0) {
      subs.windows = {
        items: room.windows.map(w => ({
          id: w.id, count: w.count, window_type: w.window_type,
          size_bucket: w.size_bucket,
          substrate_state: w.substrate || w.substrate_state || 'bare_wood'
        }))
      };
    }

    // Migrate specialty
    if (room.specialty) {
      const specMigration = [
        ['wainscot_panel_sf','wainscoting','sf_manual'], ['wood_feature_wall_sf','wood_feature_wall','sf_manual'],
        ['wood_ceiling_sf','wood_ceiling','sf_manual'], ['closet_shelving_lf','closet_shelving','lf_manual'],
        ['beam_wrap_ea','beams','ea_manual'], ['column_wrap_ea','columns','ea_manual'],
        ['fireplace_mantel_ea','mantels','ea_manual'], ['builtin_unit_ea','builtins','ea_manual'],
        ['stair_risers_ea','stair_risers','ea_manual'], ['stair_railing_ea','stair_railing','ea_manual']
      ];
      specMigration.forEach(([oldKey, newSubId, manualKey]) => {
        const v = parseFloat(room.specialty[oldKey])||0;
        if (v > 0) subs[newSubId] = { substrate_state: null, [manualKey]: v };
      });
    }

    // Build new room shape
    return {
      id: room.id, label: room.label, area_group: room.area_group || '',
      is_interior: room.is_interior !== undefined ? room.is_interior : true,
      length_ft: room.length_ft || 0, width_ft: room.width_ft || 0, height_ft: room.height_ft || 8,
      vaulted_ceiling: false, vaulted_ceiling_extra_sf: 0,
      gable_walls: 0, gable_wall_extra_sf: 0,
      quality_tier: room.quality_tier || null,
      complexity: room.complexity || null, application_method: room.application_method || null,
      substrates: subs,
      notes: room.notes || ''
    };
  });

  // Update UI tab reference
  if (migrated.ui && migrated.ui.activeTab === 'dimensions') migrated.ui.activeTab = 'scope';
  console.log('[PaintScope] Migration complete. Rooms:', migrated.rooms.length);
  return migrated;
}

function App() {
  const [state, dispatch] = useReducer(reducer, initialState, (init) => {
    try {
      const saved = localStorage.getItem('paintscope_state');
      if (saved) {
        let parsed = JSON.parse(saved);
        if (parsed.project && parsed.rooms) {
          parsed = migrateV02toV03(parsed);
          // Bump nextId past all existing IDs to prevent collisions
          let maxId = 0;
          const extractNum = (s) => { const m = s && s.match(/_(\d+)$/); return m ? parseInt(m[1]) : 0; };
          parsed.rooms.forEach(r => {
            maxId = Math.max(maxId, extractNum(r.id));
            const subs = r.substrates || {};
            (subs.doors?.items || []).forEach(d => { maxId = Math.max(maxId, extractNum(d.id)); });
            (subs.windows?.items || []).forEach(w => { maxId = Math.max(maxId, extractNum(w.id)); });
          });
          if (maxId >= nextId) nextId = maxId + 1;
          return { ...parsed, ui: parsed.ui || init.ui };
        }
      }
    } catch(e) { console.error('[PaintScope] Load error:', e); }
    return init;
  });

  // Auto-save to localStorage
  useEffect(() => {
    localStorage.setItem('paintscope_state', JSON.stringify(state));
  }, [state]);

  // Set initial active room
  useEffect(() => {
    if (!state.ui.activeRoomId && state.rooms.length > 0) {
      dispatch({type:'SET_ACTIVE_ROOM', payload:state.rooms[0].id});
    }
  }, []);

  const activeRoom = state.rooms.find(r => r.id === state.ui.activeRoomId);
  const view = state.ui.view;

  return (
    <div className="app-layout">
      {view !== 'setup' && (
        <RoomList rooms={state.rooms} activeRoomId={state.ui.activeRoomId} dispatch={dispatch} />
      )}
      <div className="main-panel">
        <div className="app-header">
          <div className="app-title"><span>PaintScope</span> Prototype {state.project.name && `— ${state.project.name}`}</div>
          <div className="btn-group">
            <button className="btn" onClick={()=>{localStorage.removeItem('paintscope_state');location.reload()}} title="Clear all data">Reset</button>
          </div>
        </div>
        <div className="nav-bar">
          <div className={`nav-item ${view==='setup'?'active':''}`} onClick={()=>dispatch({type:'SET_VIEW',payload:'setup'})}>Setup</div>
          <div className={`nav-item ${view==='editor'?'active':''}`} onClick={()=>dispatch({type:'SET_VIEW',payload:'editor'})}>Room Editor</div>
          <div className={`nav-item ${view==='summary'?'active':''}`} onClick={()=>dispatch({type:'SET_VIEW',payload:'summary'})}>Summary</div>
          <div className={`nav-item ${view==='estimate'?'active':''}`} onClick={()=>dispatch({type:'SET_VIEW',payload:'estimate'})} style={{color:view==='estimate'?'var(--accent)':''}}>Estimate</div>
          <div className={`nav-item ${view==='workorder'?'active':''}`} onClick={()=>dispatch({type:'SET_VIEW',payload:'workorder'})} style={{color:view==='workorder'?'var(--accent)':''}}>Work Order</div>
          <div className={`nav-item ${view==='export'?'active':''}`} onClick={()=>dispatch({type:'SET_VIEW',payload:'export'})}>Export / Import</div>
        </div>
        <div className="main-content">
          {view === 'setup' && <ProjectSetup project={state.project} dispatch={dispatch} />}
          {view === 'editor' && activeRoom && <RoomEditor key={activeRoom.id} room={activeRoom} project={state.project} dispatch={dispatch} />}
          {view === 'editor' && !activeRoom && <div style={{color:'var(--text-muted)',textAlign:'center',paddingTop:40}}>No rooms yet. Add a room from the sidebar.</div>}
          {view === 'summary' && <ProjectSummary state={state} />}
          {view === 'estimate' && <EstimateView state={state} />}
          {view === 'workorder' && <WorkOrderView state={state} />}
          {view === 'export' && <JsonExportView state={state} dispatch={dispatch} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
