function deriveHeightBand(heightFt) {
  if (heightFt >= 25) return 'LIFT';
  if (heightFt >= 18) return 'SCAFFOLD';
  if (heightFt >= 13) return 'EXT';
  if (heightFt >= 10) return 'STEP';
  return 'STD';
}

function deriveRoom(room) {
  const L = parseFloat(room.length_ft) || 0;
  const W = parseFloat(room.width_ft) || 0;
  const H = parseFloat(room.height_ft) || 0;
  const perimeter = 2 * (L + W);
  const subs = room.substrates || {};

  // Door/window counts from substrates
  const doorItems = subs.doors?.items || [];
  const windowItems = subs.windows?.items || [];
  const totalDoors = doorItems.reduce((s,d) => s + (parseInt(d.count)||0), 0);
  const totalWindows = windowItems.reduce((s,w) => s + (parseInt(w.count)||0), 0);
  const totalDoorSides = doorItems.reduce((s,d) => s + ((parseInt(d.count)||0) * (parseInt(d.sides_per_door)||2)), 0);

  // Opening deduction only if those substrates exist
  const openingDeduction = (totalDoors * 21) + (totalWindows * 15);
  const wallGross = perimeter * H;
  const wallNet = Math.max(0, wallGross - openingDeduction);
  const ceilingSF = L * W;

  // Vault/gable additions — auto-calculated from peak height + ridge direction
  let vaultedExtra = 0;
  let gableExtra = 0;
  let pitch = 0;
  if (room.vaulted_ceiling) {
    const P = parseFloat(room.peak_height_ft) || 0;
    const rise = Math.max(0, P - H);
    if (rise > 0) {
      const ridgeAlongLength = (room.ridge_direction || 'length') === 'length';
      const slopeRun = ridgeAlongLength ? W / 2 : L / 2;
      const slopeHyp = Math.sqrt(slopeRun * slopeRun + rise * rise);
      const slopedCeilingSF = ridgeAlongLength ? 2 * slopeHyp * L : 2 * slopeHyp * W;
      vaultedExtra = Math.round(slopedCeilingSF - ceilingSF);
      pitch = slopeRun > 0 ? Math.round(rise / slopeRun * 12 * 10) / 10 : 0;
      const gableCount = parseInt(room.gable_walls) || 0;
      const gableBase = ridgeAlongLength ? W : L;
      gableExtra = Math.round(gableCount * (gableBase * rise) / 2);
    }
  }

  // Ceiling beams — auto-calculated from vault geometry + beam config
  let beamTotalLF = 0, beamPeakLF = 0, beamCrossLFEach = 0, beamRidgeLFEach = 0;
  if (room.vaulted_ceiling && room.beams_enabled) {
    const bwIn = parseFloat(room.beam_width_in) || 6;
    const bdIn = parseFloat(room.beam_depth_in) || 6;
    const widthMult = Math.ceil(bwIn / 12);
    const depthMult = Math.ceil(bdIn / 12);
    const fullFaces = widthMult + 2 * depthMult;
    const halfFaces = widthMult + depthMult;

    const ridgeAlongLength = (room.ridge_direction || 'length') === 'length';
    const P = parseFloat(room.peak_height_ft) || 0;
    const rise = Math.max(0, P - H);
    const slopeRun = ridgeAlongLength ? W / 2 : L / 2;
    const slopeHyp = (rise > 0 && slopeRun > 0)
      ? Math.sqrt(slopeRun * slopeRun + rise * rise) : 0;

    // Peak beam — runs along the apex (horizontal)
    if (room.peak_beam) {
      beamPeakLF = ridgeAlongLength ? L : W;
      beamTotalLF += beamPeakLF * fullFaces;
    }

    // Cross beams — perpendicular to ridge, follow ceiling slope (2 slope runs)
    const crossCount = parseInt(room.cross_beam_count) || 0;
    if (crossCount > 0) {
      beamCrossLFEach = slopeHyp > 0
        ? Math.round(2 * slopeHyp * 10) / 10
        : (ridgeAlongLength ? W : L);
      beamTotalLF += crossCount * beamCrossLFEach * fullFaces;
    }

    // Ridge beams (half-beams) — along gable slope (1 slope run)
    const ridgeCount = parseInt(room.ridge_beam_count) || 0;
    if (ridgeCount > 0) {
      beamRidgeLFEach = slopeHyp > 0 ? slopeHyp : 0;
      beamTotalLF += ridgeCount * beamRidgeLFEach * halfFaces;
    }

    beamTotalLF = Math.round(beamTotalLF);
  }

  // Walls — only derive if substrate checked
  const wall_field_sf = subs.walls
    ? (subs.walls.sf_override ? parseFloat(subs.walls.sf_manual)||0 : Math.round(wallNet + gableExtra))
    : 0;

  // Ceiling — only derive if substrate checked
  const ceiling_field_sf = subs.ceiling
    ? (subs.ceiling.sf_override ? parseFloat(subs.ceiling.sf_manual)||0 : Math.round(ceilingSF + vaultedExtra))
    : 0;

  // Helper: derive LF for a trim substrate with auto-derive from catalog
  function deriveLF(subId) {
    if (!subs[subId]) return 0;
    const cat = SUBSTRATE_MAP[subId];
    if (subs[subId].lf_override) return parseFloat(subs[subId].lf_manual)||0;
    if (cat?.autoDerive) return Math.round(cat.autoDerive({ perimeter, totalDoors, totalWindows, wall_field_sf, ceiling_field_sf }));
    return parseFloat(subs[subId].lf_manual)||0;
  }

  const baseboard_lf = deriveLF('baseboard');
  const crown_lf = deriveLF('crown');
  const door_casing_lf = deriveLF('door_casing');
  const window_casing_lf = deriveLF('window_casing');
  const chair_rail_lf = deriveLF('chair_rail');
  const shoe_mold_lf = deriveLF('shoe_mold');
  const wainscot_cap_lf = deriveLF('wainscot_cap');
  const picture_rail_lf = deriveLF('picture_rail');
  const window_stool_lf = deriveLF('window_stool');
  const window_apron_lf = deriveLF('window_apron');
  const shadow_box_lf = deriveLF('shadow_box');
  const panel_mold_lf = deriveLF('panel_mold');

  // EA-based substrates
  const door_frames_ea = subs.door_frames ? (SUBSTRATE_MAP.door_frames.autoDerive({ totalDoors })) : 0;
  const window_jamb_ea = subs.window_jamb ? (SUBSTRATE_MAP.window_jamb.autoDerive({ totalWindows })) : 0;

  const effectiveHeight = (room.vaulted_ceiling && parseFloat(room.peak_height_ft) > H)
    ? parseFloat(room.peak_height_ft) : H;
  const heightBand = deriveHeightBand(effectiveHeight);

  return {
    L, W, H, effectiveHeight, perimeter, totalDoors, totalWindows, openingDeduction,
    wallGross, wallNet, ceilingSF, vaultedExtra, gableExtra, pitch,
    heightBand,
    wall_field_sf, ceiling_field_sf,
    baseboard_lf, crown_lf, door_casing_lf, window_casing_lf,
    chair_rail_lf, shoe_mold_lf, wainscot_cap_lf, picture_rail_lf,
    window_stool_lf, window_apron_lf, shadow_box_lf, panel_mold_lf,
    door_frames_ea, window_jamb_ea,
    totalDoorSides,
    beamTotalLF, beamPeakLF, beamCrossLFEach, beamRidgeLFEach
  };
}

// ============================================================
// PROTECTION DERIVATION (v0.5)
// ============================================================
function deriveProtectionSummary(room, subs, applicationMethod) {
  const items = [];

  // Floor — only if a type is selected and it's not subfloor (subfloor needs no protection)
  if (room.floor_type && room.floor_type !== 'subfloor') {
    const floorType = FLOOR_TYPES.find(f => f.id === room.floor_type);
    if (floorType) {
      items.push({ zone: 'floor', label: floorType.label, protection: room.floor_protection || floorType.defaultProtection, auto: true });
    }
  }

  // Unpainted surfaces adjacent to painted ones
  const anyPainted = Object.keys(subs).length > 0;
  if (anyPainted) {
    if (!subs.walls && subs.ceiling) items.push({ zone: 'walls_adjacent', label: 'Walls (unpainted)', protection: applicationMethod === 'spray' ? 'heavy_mask' : 'light_mask', auto: true });
    if (!subs.ceiling && subs.walls) items.push({ zone: 'ceiling_adjacent', label: 'Ceiling (unpainted)', protection: applicationMethod === 'spray' ? 'medium_mask' : 'light_mask', auto: true });
  }

  // Fixtures from room.fixtures
  Object.entries(room.fixtures || {}).forEach(function([fId, cfg]) {
    const cat = FIXTURE_MAP[fId];
    if (!cat) return;
    if (fId === 'cabinets') {
      const lf = parseFloat(cfg.linear_ft) || 0;
      const layoutLabel = cfg.layout === 'lower_only' ? 'Lower' : 'Lower + Upper';
      items.push({ zone: 'fixture_cabinets', label: cat.label + ' (' + layoutLabel + (lf > 0 ? ', ' + lf + ' LF' : '') + ')', protection: cfg.protection || cat.defaultProtection, auto: false });
    } else {
      items.push({ zone: 'fixture_' + fId, label: cat.label, protection: cfg.protection || cat.defaultProtection, count: cfg.count || 1, auto: false });
    }
  });

  return items;
}

// ============================================================
// REDUCER
// ============================================================
function reducer(state, action) {
  const { type, payload } = action;
  // Helper: update a single room by id
  function mapRoom(roomId, fn) {
    return { ...state, rooms: state.rooms.map(r => r.id === roomId ? fn(r) : r) };
  }
  switch (type) {
    case 'SET_PROJECT': return { ...state, project: { ...state.project, [payload.field]: payload.value } };
    case 'TOGGLE_PROJECT_SUBSTRATE': {
      const subs = state.project.default_substrates || [];
      const id = payload;
      const next = subs.includes(id) ? subs.filter(s => s !== id) : [...subs, id];
      return { ...state, project: { ...state.project, default_substrates: next } };
    }
    case 'SET_VIEW': return { ...state, ui: { ...state.ui, view: payload } };
    case 'SET_TAB': return { ...state, ui: { ...state.ui, activeTab: payload } };
    case 'SET_ACTIVE_ROOM': return { ...state, ui: { ...state.ui, activeRoomId: payload } };
    case 'ADD_ROOM': {
      const room = createRoom(payload || {});
      const projSubs = state.project.default_substrates || [];
      projSubs.forEach(subId => {
        if (!room.substrates[subId]) {
          if (subId === 'doors') {
            room.substrates[subId] = createSubstrateConfig(subId, { items: [createDoor()] });
          } else if (subId === 'windows') {
            room.substrates[subId] = createSubstrateConfig(subId, { items: [createWindow()] });
          } else {
            room.substrates[subId] = createSubstrateConfig(subId);
          }
        }
      });
      return { ...state, rooms:[...state.rooms, room], ui:{...state.ui, activeRoomId:room.id, activeTab:'scope', view:'editor'} };
    }
    case 'REMOVE_ROOM': {
      const rooms = state.rooms.filter(r => r.id !== payload);
      const activeId = state.ui.activeRoomId === payload ? (rooms[0]?.id || null) : state.ui.activeRoomId;
      return { ...state, rooms, ui:{...state.ui, activeRoomId:activeId} };
    }
    case 'DUPLICATE_ROOM': {
      const src = state.rooms.find(r => r.id === payload);
      if (!src) return state;
      const copy = JSON.parse(JSON.stringify(src));
      copy.id = genId('room');
      copy.label = src.label + ' (copy)';
      // Re-stamp IDs on door/window items inside substrates
      if (copy.substrates.doors?.items) copy.substrates.doors.items.forEach(d => d.id = genId('door'));
      if (copy.substrates.windows?.items) copy.substrates.windows.items.forEach(w => w.id = genId('win'));
      const idx = state.rooms.findIndex(r => r.id === payload);
      const rooms = [...state.rooms]; rooms.splice(idx+1, 0, copy);
      return { ...state, rooms, ui:{...state.ui, activeRoomId:copy.id} };
    }
    case 'SET_ROOM': {
      return mapRoom(payload.roomId, r => ({ ...r, [payload.field]: payload.value }));
    }

    // v0.3: Toggle a substrate on/off
    case 'TOGGLE_SUBSTRATE': {
      const { roomId, substrateId } = payload;
      return mapRoom(roomId, r => {
        const subs = { ...r.substrates };
        if (subs[substrateId]) {
          // Remove substrate (uncheck)
          delete subs[substrateId];
        } else {
          // Add substrate with default config from catalog
          subs[substrateId] = createSubstrateConfig(substrateId);
        }
        return { ...r, substrates: subs };
      });
    }

    // v0.3: Set a field within a specific substrate config
    case 'SET_SUBSTRATE': {
      const { roomId, substrateId, field, value } = payload;
      return mapRoom(roomId, r => {
        if (!r.substrates[substrateId]) return r;
        return {
          ...r,
          substrates: {
            ...r.substrates,
            [substrateId]: { ...r.substrates[substrateId], [field]: value }
          }
        };
      });
    }

    // Doors — now operate on substrates.doors.items
    case 'ADD_DOOR': {
      return mapRoom(payload.roomId, r => {
        const doors = r.substrates.doors || createSubstrateConfig('doors');
        return { ...r, substrates: { ...r.substrates, doors: { ...doors, items: [...(doors.items||[]), createDoor()] } } };
      });
    }
    case 'REMOVE_DOOR': {
      return mapRoom(payload.roomId, r => {
        if (!r.substrates.doors) return r;
        return { ...r, substrates: { ...r.substrates, doors: { ...r.substrates.doors, items: r.substrates.doors.items.filter(d => d.id !== payload.doorId) } } };
      });
    }
    case 'SET_DOOR': {
      return mapRoom(payload.roomId, r => {
        if (!r.substrates.doors) return r;
        return { ...r, substrates: { ...r.substrates, doors: { ...r.substrates.doors, items: r.substrates.doors.items.map(d => d.id === payload.doorId ? { ...d, [payload.field]: payload.value } : d) } } };
      });
    }

    // Windows — now operate on substrates.windows.items
    case 'ADD_WINDOW': {
      return mapRoom(payload.roomId, r => {
        const wins = r.substrates.windows || createSubstrateConfig('windows');
        return { ...r, substrates: { ...r.substrates, windows: { ...wins, items: [...(wins.items||[]), createWindow()] } } };
      });
    }
    case 'REMOVE_WINDOW': {
      return mapRoom(payload.roomId, r => {
        if (!r.substrates.windows) return r;
        return { ...r, substrates: { ...r.substrates, windows: { ...r.substrates.windows, items: r.substrates.windows.items.filter(w => w.id !== payload.winId) } } };
      });
    }
    case 'SET_WINDOW': {
      return mapRoom(payload.roomId, r => {
        if (!r.substrates.windows) return r;
        return { ...r, substrates: { ...r.substrates, windows: { ...r.substrates.windows, items: r.substrates.windows.items.map(w => w.id === payload.winId ? { ...w, [payload.field]: payload.value } : w) } } };
      });
    }

    // v0.5: Fixture toggle on/off
    case 'TOGGLE_FIXTURE': {
      const { roomId, fixtureId } = payload;
      return mapRoom(roomId, r => {
        const fixtures = { ...r.fixtures };
        if (fixtures[fixtureId]) {
          delete fixtures[fixtureId];
        } else {
          const cat = FIXTURE_MAP[fixtureId];
          if (fixtureId === 'cabinets') {
            fixtures[fixtureId] = { protection: 'heavy_mask', layout: 'lower_upper', linear_ft: 0, upper_height_ft: 2.5, notes: '' };
          } else {
            fixtures[fixtureId] = { protection: cat ? cat.defaultProtection : 'medium_mask', count: 1, size: '', notes: '' };
          }
        }
        return { ...r, fixtures };
      });
    }

    // v0.5: Set a field within a specific fixture config
    case 'SET_FIXTURE': {
      const { roomId, fixtureId, field, value } = payload;
      return mapRoom(roomId, r => {
        if (!r.fixtures[fixtureId]) return r;
        return { ...r, fixtures: { ...r.fixtures, [fixtureId]: { ...r.fixtures[fixtureId], [field]: value } } };
      });
    }

    case 'IMPORT_PROJECT': {
      return payload;
    }
    default: return state;
  }
}

// ============================================================
// EXPORT FUNCTION
// ============================================================
function exportProject(state) {
  const { project, rooms } = state;
  const quantities = {};
  const roomsData = [];
  const surfacesData = [];
  const assetsData = [];
  const edgesData = [];

  function addQty(key, uom, value) {
    if (value === 0 || value === null || value === undefined) return;
    if (!quantities[key]) quantities[key] = { uom, value: 0 };
    if (typeof value === 'number') quantities[key].value += value;
    else quantities[key].value = value;
  }

  rooms.forEach((room, ri) => {
    const d = deriveRoom(room);
    const subs = room.substrates || {};
    const effectiveQT = project.default_quality_tier;
    const effectiveHeight = d.heightBand;
    const effectiveComplexity = room.complexity || project.default_complexity;
    const effectiveMethod = room.application_method || project.default_application_method;
    const effectiveTexture = (subs.walls?.texture) || (subs.ceiling?.texture) || project.default_texture;

    roomsData.push({
      room_index: ri, room_label: room.label, area_group: room.area_group,
      length_ft: d.L, width_ft: d.W, height_ft: d.H,
      is_interior: room.is_interior, is_new_construction: project.new_construction,
      quality_tier: effectiveQT, height_band: effectiveHeight,
      complexity: effectiveComplexity, application_method: effectiveMethod, texture: effectiveTexture,
      vaulted_ceiling: !!room.vaulted_ceiling, gable_walls: parseInt(room.gable_walls)||0,
      substrates_in_scope: Object.keys(subs),
      notes: room.notes || null
    });

    // Surfaces — per-room (only emit if substrate is checked)
    function addSurface(type, uom, qty, method='derived', attrs={}) {
      if (qty <= 0) return;
      surfacesData.push({ room_label:room.label, room_index:ri, surface_type:type, uom_basis:uom, qty_value:Math.round(qty*1000)/1000, measurement_method:method, attributes:attrs });
    }

    // Walls + Ceiling — conditional
    if (subs.walls) addSurface('WALL_FIELD', 'SF', d.wall_field_sf, subs.walls.sf_override?'manual':'derived', {texture:effectiveTexture, substrate_state:subs.walls.substrate_state});
    if (subs.ceiling) addSurface('CEILING_FIELD', 'SF', d.ceiling_field_sf, subs.ceiling.sf_override?'manual':'derived', {texture:effectiveTexture, substrate_state:subs.ceiling.substrate_state});

    // Trim — conditional on substrate presence
    const trimSurfaces = [
      ['baseboard', 'TRIM_BASEBOARD', 'baseboard_lf'],
      ['crown', 'TRIM_CROWN', 'crown_lf'],
      ['door_casing', 'TRIM_CASING_DOOR', 'door_casing_lf'],
      ['window_casing', 'TRIM_CASING_WINDOW', 'window_casing_lf'],
      ['chair_rail', 'TRIM_CHAIR_RAIL', 'chair_rail_lf'],
      ['shoe_mold', 'TRIM_SHOE_MOLD', 'shoe_mold_lf'],
      ['wainscot_cap', 'TRIM_WAINSCOT_CAP', 'wainscot_cap_lf'],
      ['picture_rail', 'TRIM_PICTURE_RAIL', 'picture_rail_lf'],
      ['window_stool', 'TRIM_WINDOW_STOOL', 'window_stool_lf'],
      ['window_apron', 'TRIM_WINDOW_APRON', 'window_apron_lf'],
      ['shadow_box', 'TRIM_SHADOW_BOX', 'shadow_box_lf'],
      ['panel_mold', 'TRIM_PANEL_MOLD', 'panel_mold_lf'],
    ];
    trimSurfaces.forEach(([subId, surfType, derivedKey]) => {
      if (subs[subId]) {
        const lf = d[derivedKey] || 0;
        const isOverride = subs[subId].lf_override || (!SUBSTRATE_MAP[subId]?.autoDerive);
        addSurface(surfType, 'LF', lf, isOverride?'manual':'derived', {substrate_state:subs[subId].substrate_state});
      }
    });

    // Doors — from substrates.doors.items
    const doorItems = subs.doors?.items || [];
    doorItems.forEach(door => {
      const cnt = parseInt(door.count)||0;
      const sides = cnt * (parseInt(door.sides_per_door)||2);
      if (cnt > 0) {
        addSurface('DOOR_SLAB', 'EA_SIDE', sides, 'manual', {door_type:door.door_type, substrate_state:door.substrate_state});
        assetsData.push({ room_label:room.label, room_index:ri, asset_category:'DOOR', asset_subtype:door.door_type, protect_uom:'EA', protect_qty:cnt, attributes:{substrate_state:door.substrate_state, sides_per_door:door.sides_per_door} });
      }
    });

    // Door Frames — independent substrate
    if (subs.door_frames) addSurface('DOOR_FRAME', 'EA', d.door_frames_ea, 'derived', {substrate_state:subs.door_frames.substrate_state});

    // Windows — from substrates.windows.items
    const windowItems = subs.windows?.items || [];
    windowItems.forEach(win => {
      const cnt = parseInt(win.count)||0;
      if (cnt > 0) {
        addSurface(`WINDOW_${win.size_bucket}`, 'EA', cnt, 'manual', {window_type:win.window_type, substrate_state:win.substrate_state});
        assetsData.push({ room_label:room.label, room_index:ri, asset_category:'WINDOW', asset_subtype:win.window_type, protect_uom:'EA', protect_qty:cnt, attributes:{size_bucket:win.size_bucket, substrate_state:win.substrate_state} });
      }
    });

    // Window Jambs — independent substrate
    if (subs.window_jamb) addSurface('WINDOW_JAMB', 'EA', d.window_jamb_ea, 'derived', {substrate_state:subs.window_jamb.substrate_state});

    // Specialty — conditional on substrate presence
    const specSurfaces = [
      ['wainscoting','WAINSCOTING','SF','sf_manual'], ['wood_feature_wall','WOOD_WALL','SF','sf_manual'],
      ['wood_ceiling','WOOD_CEILING','SF','sf_manual'], ['closet_shelving','CLOSET_SHELF','LF','lf_manual'],
      ['beams','ARCH_BEAM','EA','ea_manual'], ['columns','ARCH_COLUMN','EA','ea_manual'],
      ['mantels','ARCH_MANTEL','EA','ea_manual'], ['builtins','BUILTIN','EA','ea_manual'],
      ['stair_risers','STAIR_RISER','EA','ea_manual'], ['stair_railing','STAIR_RAILING','EA','ea_manual']
    ];
    specSurfaces.forEach(([subId, surfType, uom, manualKey]) => {
      if (subs[subId]) {
        const v = parseFloat(subs[subId][manualKey])||0;
        if (v > 0) addSurface(surfType, uom, v, 'manual', {substrate_state:subs[subId].substrate_state});
      }
    });

    // Edges — per-room
    if (d.perimeter > 0 && d.ceiling_field_sf > 0) edgesData.push({ room_label:room.label, room_index:ri, edge_target:'TO_CEILING', length_lf:Math.round(d.perimeter), edge_class:null });
    const trimLF = d.baseboard_lf + d.door_casing_lf + d.window_casing_lf;
    if (trimLF > 0) edgesData.push({ room_label:room.label, room_index:ri, edge_target:'TO_TRIM', length_lf:Math.round(trimLF), edge_class:null });

    // Quantity keys (rolled up) — conditional on substrates
    if (subs.walls) addQty('PS_SURFACE_SF.WALL_FIELD', 'SF', d.wall_field_sf);
    if (subs.ceiling) addQty('PS_SURFACE_SF.CEILING_FIELD', 'SF', d.ceiling_field_sf);

    trimSurfaces.forEach(([subId, surfType, derivedKey]) => {
      if (subs[subId]) addQty(`PS_SURFACE_LF.${surfType}`, 'LF', d[derivedKey]||0);
    });

    // Door quantity keys
    doorItems.forEach(door => {
      const cnt = parseInt(door.count)||0;
      const sides = cnt * (parseInt(door.sides_per_door)||2);
      addQty('PS_SURFACE_EA_SIDE.DOOR_SLAB', 'EA_SIDE', sides);
      addQty('PS_OPENING_EA.DOOR_OPENINGS_TOTAL', 'EA', cnt);
      const dtMap = { flush:'SLAB', panel_4:'PANEL', panel_6:'PANEL', french:'FRENCH', bifold:'BIFOLD', louvered:'LOUVERED' };
      if (dtMap[door.door_type]) addQty(`PS_META.EA_SIDE.DOOR_SLAB.${dtMap[door.door_type]}`, 'EA_SIDE', sides);
    });
    if (subs.door_frames) addQty('PS_SURFACE_EA.DOOR_FRAME_SET', 'EA', d.door_frames_ea);

    // Window quantity keys
    windowItems.forEach(win => {
      const cnt = parseInt(win.count)||0;
      addQty(`PS_OPENING_EA.WINDOW_${win.size_bucket}`, 'EA', cnt);
      addQty('PS_OPENING_EA.WINDOW_TOTAL', 'EA', cnt);
      addQty('PS_OPENING_EA.WINDOW_OPENINGS_TOTAL', 'EA', cnt);
    });
    if (subs.window_jamb) {
      addQty('PS_SURFACE_EA.WINDOW_JAMB', 'EA', d.window_jamb_ea);
      if (!subs.windows || !windowItems.length) {
        addQty('PS_OPENING_EA.WINDOW_TOTAL', 'EA', d.window_jamb_ea);
      }
    }

    // Specialty quantity keys
    specSurfaces.forEach(([subId, surfType, uom, manualKey]) => {
      if (subs[subId]) {
        const v = parseFloat(subs[subId][manualKey])||0;
        const psPrefix = uom === 'SF' ? 'PS_SURFACE_SF' : uom === 'LF' ? 'PS_SURFACE_LF' : 'PS_SURFACE_EA';
        if (v > 0) addQty(`${psPrefix}.${surfType}`, uom, v);
      }
    });

    // Aggregate all trim LF for specs that use PS_SURFACE_LF.TRIM_TOTAL
    const allTrimLF = trimSurfaces.reduce((s, [subId,,derivedKey]) => s + (subs[subId] ? (d[derivedKey]||0) : 0), 0);
    addQty('PS_SURFACE_LF.TRIM_TOTAL', 'LF', allTrimLF);
    // Trim joints — approximately equal to total trim LF (every piece has joints)
    addQty('PS_EDGE_LF.TRIM_JOINTS', 'LF', allTrimLF);

    // Edge quantity keys
    addQty('PS_EDGE_LF.TO_CEILING', 'LF', d.perimeter);
    addQty('PS_EDGE_LF.TO_TRIM', 'LF', trimLF);

    // Protection quantity keys (derived) — floor level driven by floor_type
    const floorProt = room.floor_protection || '';
    const hasFloorProtection = room.floor_type && room.floor_type !== 'subfloor' && floorProt;
    if (hasFloorProtection) {
      addQty('PS_PROTECT_SF.FLOOR_EXPOSED', 'SF', d.ceilingSF);
      if (floorProt === 'heavy_mask' || floorProt === 'medium_mask') {
        addQty('PS_PROTECT_SF.FLOOR_PERIMETER', 'SF', d.perimeter * 2);
      }
    }
    // WORKZONE = localized spray overspray zones: 8ft radius semicircle per door (~101 SF),
    // 8ft radius quarter-circle per window (~50 SF, half arc since against wall), capped at floor area
    const workzoneSF = Math.min(
      Math.round(d.totalDoors * (Math.PI * 64 / 2) + d.totalWindows * (Math.PI * 64 / 4)),
      d.ceilingSF
    );
    addQty('PS_PROTECT_SF.FLOOR_WORKZONE', 'SF', workzoneSF);
    addQty('PS_PROTECT_LF.TRIM_EDGES', 'LF', trimLF);
    if (subs.baseboard) addQty('PS_PROTECT_LF.TRIM_BASEBOARD', 'LF', d.baseboard_lf);
    if (subs.door_casing) addQty('PS_PROTECT_LF.TRIM_CASING_DOOR', 'LF', d.door_casing_lf);
    if (subs.window_casing) addQty('PS_PROTECT_LF.TRIM_CASING_WINDOW', 'LF', d.window_casing_lf);
    addQty('PS_PROTECT_LF.CEILING_LINE', 'LF', d.perimeter);
    addQty('PS_META.SF.FLOOR_VACUUM_AREA', 'SF', d.ceilingSF);

    // Fixture protection keys (v0.5)
    Object.entries(room.fixtures || {}).forEach(function([fId, cfg]) {
      if (fId === 'cabinets') {
        const lf = parseFloat(cfg.linear_ft) || 0;
        if (lf > 0) addQty('PS_PROTECT_LF.FIXTURE_CABINETS', 'LF', lf);
      } else {
        const cnt = parseInt(cfg.count) || 1;
        addQty('PS_PROTECT_EA.FIXTURE_' + fId.toUpperCase(), 'EA', cnt);
      }
    });

    // Meta
    addQty('PS_META.EA.ROOMS_TOTAL', 'EA', 1);
    addQty('PS_META.EA.CASING_END_COUNT', 'EA', d.totalDoors*2 + d.totalWindows*4);
  });

  return {
    ps_scope_run: {
      project_name: project.name || 'Untitled Project',
      new_construction: project.new_construction,
      default_quality_tier: project.default_quality_tier,
      default_application_method: project.default_application_method,
      default_texture: project.default_texture,
      status: 'draft',
      created_at: new Date().toISOString()
    },
    ps_rooms: roomsData,
    ps_surfaces: surfacesData,
    ps_assets: assetsData,
    ps_edges: edgesData,
    ps_quantities: Object.entries(quantities)
      .filter(([,v]) => v.value !== 0)
      .sort(([a],[b]) => a.localeCompare(b))
      .map(([key, val]) => ({
        quantity_key: key, uom: val.uom,
        value: typeof val.value === 'number' ? Math.round(val.value * 1000) / 1000 : null,
        text_value: typeof val.value === 'string' ? val.value : null,
        source: 'derived'
      })),
    _meta: {
      tool: 'PaintScope Prototype',
      version: '0.3.0',
      exported_at: new Date().toISOString(),
      room_count: rooms.length,
      total_wall_sf: quantities['PS_SURFACE_SF.WALL_FIELD']?.value || 0,
      total_ceiling_sf: quantities['PS_SURFACE_SF.CEILING_FIELD']?.value || 0
    }
  };
}

// ============================================================
// ESTIMATION ENGINE — Pure functions, no side effects
// ============================================================

// DOCTRINE fallbacks removed — per doctrine, all modifier values must come from
// the data layer. If a modifier is missing from DB, the engine warns (fail loud)
// and uses 1.0 (neutral) rather than silently applying a hardcoded value.

const PHASE_ORDER = ['setup','prep','prime','apply','interstage','finish','cleanup'];
const PHASE_COLORS = {
  setup:      'rgba(130,170,255,0.10)',
  prep:       'rgba(255,190,100,0.12)',
  prime:      'rgba(180,140,255,0.10)',
  apply:      'rgba(100,210,140,0.12)',
  interstage: 'rgba(255,160,180,0.10)',
  finish:     'rgba(80,200,220,0.12)',
  cleanup:    'rgba(160,160,160,0.10)'
};

// Friendly display names for spec families — paintable item names
const SPEC_DISPLAY_NAMES = {
  'SF_DRYWALL_WALL_NC_FINISH': 'Walls',
  'SF_DRYWALL_WALL_NC_PRIME': 'Walls (Prime)',
  'SF_DRYWALL_CEILING_NC_FINISH': 'Ceilings',
  'SF_DRYWALL_CEILING_NC_PRIME': 'Ceilings (Prime)',
  'SF_TRIM_NC_PAINT': 'Trim',
  'SF_TRIM_NC_PRIME': 'Trim (Prime)',
  'SF_DOOR_SLAB_INT_NC': 'Doors',
  'SF_DOOR_FRAME_NC_FINISH': 'Door Frames',
  'SF_WINDOW_INT_NC': 'Windows',
  'SF_CABINET_NC_PAINT': 'Cabinets',
  'SF_CLOSET_SHELF_NC': 'Closet Shelves',
  'SF_WOOD_CEILING_NC': 'Wood Ceilings',
  'SF_WOOD_WALL_NC': 'Wood Walls',
  'SF_WAINSCOT_PANEL_NC': 'Wainscoting',
  'SF_ARCH_ELEMENT_NC': 'Architectural Elements',
  'SF_BUILTIN_NC': 'Built-Ins',
  'SF_STAIR_RAILING_NC': 'Stair Railings',
  'SF_STAIR_RISER_NC': 'Stair Risers',
};
function specDisplayName(specId) { return SPEC_DISPLAY_NAMES[specId] || specId.replace(/^SF_/,'').replace(/_/g,' '); }

// Floor protection level hierarchy - higher rank = more protection
const FLOOR_PROTECTION_HIERARCHY = {
  'edge_only': 1, 'partial_cover': 2, 'full_cover': 3, 'heavy_cover': 4
};
const FLOOR_ZONE_IDS = new Set([
  'floor_full','floor_perimeter','floor_workzone',
  'floor_full_kitchen','floor_full_8ft_radius','floor_door_swing'
]);

// Preferred donor specs for floor protection rates (canonical full-room tasks)
const FLOOR_PROTECTION_DONOR_PRIORITY = [
  'SF_DRYWALL_WALL_NC_PRIME', 'SF_DRYWALL_CEILING_NC_PRIME',
  'SF_DRYWALL_WALL_NC_FINISH', 'SF_DRYWALL_CEILING_NC_FINISH'
];

/**
 * Classify a task as a floor install/remove candidate.
 * Returns null if not a pure floor protection task, or {action, protectionRank} if it is.
 * Mixed-zone tasks (floor + wall/fixture) are NOT classified - they stay with their specs.
 * Maintain tasks are NOT classified - they stay with their specs.
 */
function classifyFloorProtectionTask(sopTask, db) {
  const pm = sopTask.protection_metadata;
  if (!pm || !pm.action || !pm.zones) return null;
  if (pm.action === 'maintain') return null;
  if (pm.action !== 'setup' && pm.action !== 'teardown') return null;

  const zones = pm.zones || [];
  const floorZones = zones.filter(z => FLOOR_ZONE_IDS.has(z));
  if (floorZones.length === 0) return null;

  // Only classify if ALL zones are floor zones (exclude mixed tasks)
  const nonFloorZones = zones.filter(z => !FLOOR_ZONE_IDS.has(z));
  if (nonFloorZones.length > 0) return null;

  // Resolve highest protection level from the zones
  let maxRank = 0;
  let maxLevelName = 'edge_only';
  const zoneTable = db.spec_protection_zones || [];
  for (const zone of floorZones) {
    const zoneRow = zoneTable.find(
      r => r.zone_id === zone && r.spec_family_id === sopTask.spec_family_id
    );
    const level = zoneRow ? zoneRow.protection_level : 'edge_only';
    const rank = FLOOR_PROTECTION_HIERARCHY[level] || 1;
    if (rank > maxRank) { maxRank = rank; maxLevelName = level; }
  }

  return { action: pm.action, protectionRank: maxRank, protectionLevel: maxLevelName };
}

/**
 * Post-process estimation results to deduplicate floor protection.
 * Removes floor install/remove tasks from individual specs and emits
 * one install + one remove per room under a Room Protection category.
 */
function resolveRoomFloorProtection(specResults, db, rooms) {
  // Build index: taskId::specFamilyId -> sop_task record (for protection_metadata lookup)
  const sopTaskIndex = {};
  (db.sop_tasks || []).forEach(t => {
    sopTaskIndex[t.id + '::' + t.spec_family_id] = t;
  });

  // Scan all task results and classify floor protection tasks
  // roomIndex -> [{ taskResult, specIdx, taskIdx, specId, classification }]
  const roomFloorTasks = {};

  specResults.forEach((sr, specIdx) => {
    sr.tasks.forEach((task, taskIdx) => {
      const sopTask = sopTaskIndex[task.taskId + '::' + sr.specId];
      if (!sopTask) return;

      const cls = classifyFloorProtectionTask(sopTask, db);
      if (!cls) return;

      const ri = task.roomIndex;
      if (!roomFloorTasks[ri]) roomFloorTasks[ri] = [];
      roomFloorTasks[ri].push({
        taskResult: task,
        specIdx, taskIdx,
        specId: sr.specId,
        specName: sr.specName,
        classification: cls
      });
    });
  });

  const roomProtection = {};

  for (const [ri, entries] of Object.entries(roomFloorTasks)) {
    if (entries.length === 0) continue;

    // Determine winning protection level (highest rank across all specs in this room)
    let maxRank = 0;
    entries.forEach(e => {
      if (e.classification.protectionRank > maxRank) {
        maxRank = e.classification.protectionRank;
      }
    });

    const winningLevel = Object.entries(FLOOR_PROTECTION_HIERARCHY)
      .find(([, rank]) => rank === maxRank)?.[0] || 'edge_only';

    // Select donor tasks for setup and teardown
    // Prefer canonical drywall prime/finish specs, then fall back to highest-rank
    const setupCandidates = entries.filter(e => e.classification.action === 'setup');
    const teardownCandidates = entries.filter(e => e.classification.action === 'teardown');

    function pickDonor(candidates) {
      if (candidates.length === 0) return null;
      // First try preferred donors at the winning protection level
      const atWinningLevel = candidates.filter(e => e.classification.protectionRank === maxRank);
      for (const prefSpec of FLOOR_PROTECTION_DONOR_PRIORITY) {
        const found = atWinningLevel.find(e => e.specId === prefSpec);
        if (found) return found;
      }
      // Fall back to any candidate at winning level
      if (atWinningLevel.length > 0) return atWinningLevel[0];
      // Fall back to highest rank candidate
      return candidates.sort((a,b) => b.classification.protectionRank - a.classification.protectionRank)[0];
    }

    const donorSetup = pickDonor(setupCandidates);
    const donorTeardown = pickDonor(teardownCandidates);

    const protTasks = [];
    const levelLabel = winningLevel.replace(/_/g, ' ');

    if (donorSetup) {
      protTasks.push({
        ...donorSetup.taskResult,
        taskId: '__RP_INSTALL__',
        taskName: 'Install Floor Protection (' + levelLabel + ')',
        phase: 'setup',
        isRoomProtection: true,
        donorSpecId: donorSetup.specId,
        protectionLevel: winningLevel
      });
    }

    if (donorTeardown) {
      protTasks.push({
        ...donorTeardown.taskResult,
        taskId: '__RP_REMOVE__',
        taskName: 'Remove Floor Protection',
        phase: 'cleanup',
        isRoomProtection: true,
        donorSpecId: donorTeardown.specId,
        protectionLevel: winningLevel
      });
    }

    if (protTasks.length > 0) {
      roomProtection[ri] = {
        tasks: protTasks,
        totalHours: Math.round(protTasks.reduce((s, t) => s + t.hours, 0) * 1000) / 1000,
        protectionLevel: winningLevel
      };
    }

    // Suppress original floor install/remove tasks from specs
    const taskKeysToRemove = new Set(
      entries.map(e => e.specId + '::' + e.taskResult.taskId + '::' + e.taskResult.roomIndex)
    );

    specResults.forEach(sr => {
      const before = sr.tasks.length;
      sr.tasks = sr.tasks.filter(t => {
        const key = sr.specId + '::' + t.taskId + '::' + t.roomIndex;
        return !taskKeysToRemove.has(key);
      });
      if (sr.tasks.length < before) {
        sr.totalHours = Math.round(sr.tasks.reduce((s, t) => s + t.hours, 0) * 100) / 100;
        // Recalculate phaseHours
        sr.phaseHours = {};
        sr.tasks.forEach(t => {
          const p = t.phase || 'apply';
          sr.phaseHours[p] = (sr.phaseHours[p] || 0) + t.hours;
        });
        Object.keys(sr.phaseHours).forEach(p => {
          sr.phaseHours[p] = Math.round(sr.phaseHours[p] * 100) / 100;
        });
      }
    });

    // Remove specs that now have zero tasks
    // (don't do this - spec might still have non-floor tasks)
  }

  return roomProtection;
}

/**
 * Build per-room quantity lookup from the prototype state.
 * Returns Map<roomIndex, Map<psKey, {value, uom}>>
 */
function buildRoomQuantityLookups(state) {
  const { project, rooms } = state;
  const roomLookups = new Map();

  rooms.forEach((room, ri) => {
    const d = deriveRoom(room);
    const subs = room.substrates || {};
    const qty = new Map();

    function addQ(key, uom, val) {
      if (!val || val <= 0) return;
      const existing = qty.get(key);
      if (existing) existing.value += val;
      else qty.set(key, { value: val, uom });
    }

    // Wall + Ceiling — conditional
    if (subs.walls) addQ('PS_SURFACE_SF.WALL_FIELD', 'SF', d.wall_field_sf);
    if (subs.ceiling) addQ('PS_SURFACE_SF.CEILING_FIELD', 'SF', d.ceiling_field_sf);

    // Trim — conditional on substrate presence
    const trimKeys = [
      ['baseboard', 'TRIM_BASEBOARD', 'baseboard_lf'],
      ['crown', 'TRIM_CROWN', 'crown_lf'],
      ['door_casing', 'TRIM_CASING_DOOR', 'door_casing_lf'],
      ['window_casing', 'TRIM_CASING_WINDOW', 'window_casing_lf'],
      ['chair_rail', 'TRIM_CHAIR_RAIL', 'chair_rail_lf'],
      ['shoe_mold', 'TRIM_SHOE_MOLD', 'shoe_mold_lf'],
      ['wainscot_cap', 'TRIM_WAINSCOT_CAP', 'wainscot_cap_lf'],
      ['picture_rail', 'TRIM_PICTURE_RAIL', 'picture_rail_lf'],
      ['window_stool', 'TRIM_WINDOW_STOOL', 'window_stool_lf'],
      ['window_apron', 'TRIM_WINDOW_APRON', 'window_apron_lf'],
      ['shadow_box', 'TRIM_SHADOW_BOX', 'shadow_box_lf'],
      ['panel_mold', 'TRIM_PANEL_MOLD', 'panel_mold_lf'],
    ];
    trimKeys.forEach(([subId, surfType, derivedKey]) => {
      if (subs[subId]) addQ(`PS_SURFACE_LF.${surfType}`, 'LF', d[derivedKey]||0);
    });

    // Aggregate all trim LF for specs that use PS_SURFACE_LF.TRIM_TOTAL
    const allTrimLF = trimKeys.reduce((s, [subId,,derivedKey]) => s + (subs[subId] ? (d[derivedKey]||0) : 0), 0);
    addQ('PS_SURFACE_LF.TRIM_TOTAL', 'LF', allTrimLF);
    // Trim joints — approximately equal to total trim LF (every piece has joints)
    addQ('PS_EDGE_LF.TRIM_JOINTS', 'LF', allTrimLF);

    // Doors — from substrates.doors.items
    const doorItems = subs.doors?.items || [];
    doorItems.forEach(door => {
      const cnt = parseInt(door.count)||0;
      const sides = cnt * (parseInt(door.sides_per_door)||2);
      addQ('PS_SURFACE_EA_SIDE.DOOR_SLAB', 'EA_SIDE', sides);
      addQ('PS_OPENING_EA.DOOR_OPENINGS_TOTAL', 'EA', cnt);
    });
    if (subs.door_frames) addQ('PS_SURFACE_EA.DOOR_FRAME_SET', 'EA', d.door_frames_ea);

    // Windows — from substrates.windows.items
    const windowItems = subs.windows?.items || [];
    windowItems.forEach(win => {
      const cnt = parseInt(win.count)||0;
      addQ(`PS_OPENING_EA.WINDOW_${win.size_bucket}`, 'EA', cnt);
      addQ('PS_OPENING_EA.WINDOW_TOTAL', 'EA', cnt);
      addQ('PS_OPENING_EA.WINDOW_OPENINGS_TOTAL', 'EA', cnt);
    });
    if (subs.window_jamb) {
      addQ('PS_SURFACE_EA.WINDOW_JAMB', 'EA', d.window_jamb_ea);
      // Jamb count also contributes to WINDOW_TOTAL when windows not already selected
      // (per-window rates include jamb work — same EA count)
      if (!subs.windows || !windowItems.length) {
        addQ('PS_OPENING_EA.WINDOW_TOTAL', 'EA', d.window_jamb_ea);
      }
    }

    // Specialty — conditional
    const specKeys = [
      ['wainscoting','PS_SURFACE_SF.WAINSCOTING','SF','sf_manual'], ['wood_feature_wall','PS_SURFACE_SF.WOOD_WALL','SF','sf_manual'],
      ['wood_ceiling','PS_SURFACE_SF.WOOD_CEILING','SF','sf_manual'], ['closet_shelving','PS_SURFACE_LF.CLOSET_SHELF','LF','lf_manual'],
      ['beams','PS_SURFACE_LF.ARCH_BEAM','LF','ea_manual'], ['columns','PS_SURFACE_EA.ARCH_COLUMN','EA','ea_manual'],
      ['mantels','PS_SURFACE_EA.ARCH_MANTEL','EA','ea_manual'], ['builtins','PS_SURFACE_EA.BUILTIN','EA','ea_manual'],
      ['stair_risers','PS_SURFACE_EA.STAIR_RISER','EA','ea_manual'], ['stair_railing','PS_SURFACE_EA.STAIR_RAILING','EA','ea_manual']
    ];
    specKeys.forEach(([subId, psKey, uom, manualKey]) => {
      if (subs[subId]) {
        const v = parseFloat(subs[subId][manualKey])||0;
        if (v > 0) addQ(psKey, uom, v);
      }
    });

    // Ceiling beams — geometry-derived LF from vault config, feeds ARCH_BEAM spec
    if (room.vaulted_ceiling && room.beams_enabled && d.beamTotalLF > 0) {
      addQ('PS_SURFACE_LF.ARCH_BEAM', 'LF', d.beamTotalLF);
    }

    // Edges
    addQ('PS_EDGE_LF.TO_CEILING', 'LF', d.perimeter);
    const trimLF = d.baseboard_lf + d.door_casing_lf + d.window_casing_lf;
    addQ('PS_EDGE_LF.TO_TRIM', 'LF', trimLF);

    // Protection — floor level driven by floor_type + user override
    const floorProt2 = room.floor_protection || '';
    const hasFloorProt = room.floor_type && room.floor_type !== 'subfloor' && floorProt2;
    if (hasFloorProt) {
      addQ('PS_PROTECT_SF.FLOOR_EXPOSED', 'SF', d.ceilingSF);
      if (floorProt2 === 'heavy_mask' || floorProt2 === 'medium_mask') {
        addQ('PS_PROTECT_SF.FLOOR_PERIMETER', 'SF', d.perimeter * 2);
      }
    }
    // WORKZONE = localized spray zones: 8ft radius semicircle per door, quarter-circle per window
    const wzSF = Math.min(
      Math.round(d.totalDoors * (Math.PI * 64 / 2) + d.totalWindows * (Math.PI * 64 / 4)),
      d.ceilingSF
    );
    addQ('PS_PROTECT_SF.FLOOR_WORKZONE', 'SF', wzSF);
    addQ('PS_PROTECT_LF.TRIM_EDGES', 'LF', trimLF);
    if (subs.baseboard) addQ('PS_PROTECT_LF.TRIM_BASEBOARD', 'LF', d.baseboard_lf);
    if (subs.door_casing) addQ('PS_PROTECT_LF.TRIM_CASING_DOOR', 'LF', d.door_casing_lf);
    if (subs.window_casing) addQ('PS_PROTECT_LF.TRIM_CASING_WINDOW', 'LF', d.window_casing_lf);
    addQ('PS_PROTECT_LF.CEILING_LINE', 'LF', d.perimeter);

    // Fixture protection keys (v0.5)
    Object.entries(room.fixtures || {}).forEach(function([fId, cfg]) {
      if (fId === 'cabinets') {
        const lf = parseFloat(cfg.linear_ft) || 0;
        if (lf > 0) addQ('PS_PROTECT_LF.FIXTURE_CABINETS', 'LF', lf);
      } else {
        const cnt = parseInt(cfg.count) || 1;
        addQ('PS_PROTECT_EA.FIXTURE_' + fId.toUpperCase(), 'EA', cnt);
      }
    });

    // Meta
    addQ('PS_META.EA.ROOMS_TOTAL', 'EA', 1);
    addQ('PS_META.EA.CASING_END_COUNT', 'EA', d.totalDoors*2 + d.totalWindows*4);
    addQ('PS_META.SF.FLOOR_VACUUM_AREA', 'SF', d.ceilingSF);

    roomLookups.set(ri, qty);
  });
  return roomLookups;
}

/**
 * Resolve the effective application_method for a given spec+room combination.
 * Priority: substrate config override -> substrate type default -> room override -> project default.
 */
function resolveQualityTier(specId, room, project) {
  const primarySub = SPEC_SUBSTRATE_MAP[specId];
  if (primarySub) {
    const subConfig = room.substrates && room.substrates[primarySub];
    if (subConfig && subConfig.quality_tier) {
      return subConfig.quality_tier;
    }
  }
  return project.default_quality_tier;
}

function resolveApplicationMethod(specId, room, project) {
  const primarySub = SPEC_SUBSTRATE_MAP[specId];
  if (primarySub) {
    const subConfig = room.substrates && room.substrates[primarySub];
    // 1. Substrate-level override (user explicitly set it on the tab)
    if (subConfig && subConfig.application_method) {
      return subConfig.application_method;
    }
    // 2. Substrate type default (e.g. brush for trim, spray_backroll for walls)
    const sam = SUBSTRATE_APPLICATION_METHODS[primarySub];
    if (sam) {
      return sam.default;
    }
  }
  // 3. Room-level override, then project default
  return room.application_method || project.default_application_method;
}

/**
 * Resolve the effective surface_texture for a given spec+room combination.
 * For wall/ceiling specs, use the substrate's texture. Otherwise project default.
 */
function resolveTextureForSpec(specId, room, project) {
  const primarySub = SPEC_SUBSTRATE_MAP[specId];
  if (primarySub) {
    const subConfig = room.substrates && room.substrates[primarySub];
    if (subConfig && subConfig.texture) return subConfig.texture;
  }
  // Fallback: walls texture -> ceiling texture -> project default
  return (room.substrates?.walls?.texture) || (room.substrates?.ceiling?.texture) || project.default_texture;
}

/**
 * Resolve the spec system state (SS_*) for a spec's primary substrate in a room.
 * For items-based substrates (doors/windows), checks the first item's state.
 * Falls back to SUBSTRATE_CATALOG default when substrate_state is null.
 */
function resolveSubstrateStateForSpec(specId, room) {
  const primarySub = SPEC_SUBSTRATE_MAP[specId];
  if (!primarySub) return null;

  const subs = room.substrates || {};

  // For trim specs, check all trim-group substrates (they share prime/paint specs)
  // For window spec, also check window_jamb as a fallback when windows aren't selected
  const subIds = (primarySub === 'baseboard')
    ? SUBSTRATE_CATALOG.filter(s => s.group === 'Trim').map(s => s.id).filter(id => subs[id])
    : (primarySub === 'windows')
      ? [subs.windows ? 'windows' : null, subs.window_jamb ? 'window_jamb' : null].filter(Boolean)
      : (subs[primarySub] ? [primarySub] : []);

  // Return array of resolved SS_* states for all relevant substrates in this room
  const states = [];
  for (const sid of subIds) {
    const config = subs[sid];
    if (!config) continue;

    let uiState = config.substrate_state;
    // Items-based substrates: use first item's state
    if (!uiState && config.items && config.items.length > 0) {
      uiState = config.items[0].substrate_state;
    }
    // Fall back to catalog default
    if (!uiState) {
      const cat = SUBSTRATE_MAP[sid];
      if (cat && cat.defaultConfig) uiState = cat.defaultConfig.substrate_state;
    }
    if (uiState) {
      const mapped = UI_STATE_TO_SPEC_STATE[uiState];
      if (mapped) states.push(mapped);
    }
  }
  return states;
}

/**
 * Check if a spec's valid_input_states accepts a given SS_* state.
 * Handles 'SS_PAINTED' prefix matching for previously_painted substrates.
 */
function specAcceptsState(specId, specState) {
  const validStates = SPEC_VALID_INPUT_STATES[specId];
  if (!validStates) return true;
  if (!specState) return true;
  if (validStates.includes(specState)) return true;
  // Prefix match: previously_painted maps to generic SS_PAINTED
  if (specState === 'SS_PAINTED') {
    return validStates.some(s => s.startsWith('SS_PAINTED'));
  }
  return false;
}

/**
 * Check if a spec should activate for a room based on substrate state compatibility.
 * Uses direct match + one-level chain activation: if another spec produces a state
 * this spec accepts (e.g., wall prime outputs SS_PRIMED_FIELD → wall finish accepts it).
 */
function isSpecStateCompatible(specId, room) {
  const states = resolveSubstrateStateForSpec(specId, room);
  if (!states || states.length === 0) return true; // No state info = allow

  for (const specState of states) {
    // Direct match: substrate state is in this spec's valid_input_states
    if (specAcceptsState(specId, specState)) return true;

    // Chain match: another spec produces a state this spec accepts
    const primarySub = SPEC_SUBSTRATE_MAP[specId];
    for (const [producerSpecId, outputState] of Object.entries(SPEC_OUTPUT_STATES)) {
      if (producerSpecId === specId) continue;
      // Producer must serve the same substrate group
      if (SPEC_SUBSTRATE_MAP[producerSpecId] !== primarySub) continue;
      // Producer must accept the current substrate state
      if (!specAcceptsState(producerSpecId, specState)) continue;
      // This spec must accept the producer's output
      const validStates = SPEC_VALID_INPUT_STATES[specId];
      if (validStates && validStates.includes(outputState)) return true;
    }
  }
  return false;
}

/**
 * Evaluate applies_when JSON condition against room context.
 * Condition format: {"quality_tier":["QT3","QT4"], "application_method":["spray_backroll"]}
 * All keys must match (AND logic). Each value is an array of allowed values (OR logic).
 */
function evaluateAppliesWhen(condition, ctx) {
  if (!condition || typeof condition !== 'object') return true;
  for (const [key, allowed] of Object.entries(condition)) {
    if (!Array.isArray(allowed)) continue;
    const ctxVal = ctx[key];
    if (ctxVal === undefined || ctxVal === null) continue; // Missing context = pass
    if (!allowed.includes(ctxVal)) return false;
  }
  return true;
}

/**
 * Compute modifier stack for a spec family + room context.
 * Returns { qt, height, texture, complexity, total }
 */
function computeModifierStack(specFamilyId, ctx, db, warnings) {
  // Per doctrine: all modifier values must come from the data layer.
  // If a modifier is missing, warn and use 1.0 (neutral) — never silently fallback.

  // 1. QT modifier — from quality_tier_effects table
  let qtMod = 1.0;
  const qteRow = db.quality_tier_effects.find(
    r => r.spec_family_id === specFamilyId && r.quality_tier === ctx.quality_tier
  );
  if (qteRow && qteRow.time_modifier != null) {
    qtMod = qteRow.time_modifier;
  } else if (ctx.quality_tier && ctx.quality_tier !== 'QT3') {
    warnings.push(`QT modifier for ${ctx.quality_tier} not found in DB for ${specFamilyId}. Using 1.0 (neutral).`);
  }

  // 2. Height modifier — from factor_modifiers
  let heightMod = 1.0;
  const heightFactors = db.factor_modifiers.filter(
    f => f.spec_family_id === specFamilyId && f.modifier_category === 'height'
  );
  if (heightFactors.length > 0) {
    // Try to find matching height band in condition JSON
    for (const hf of heightFactors) {
      if (hf.condition && typeof hf.condition === 'object') {
        const bandKey = ctx.height_band ? ctx.height_band.toLowerCase() : 'standard';
        for (const [k, v] of Object.entries(hf.condition)) {
          const kLower = k.toLowerCase();
          if (kLower.includes(bandKey) || kLower === bandKey ||
              (bandKey === 'std' && kLower.includes('standard'))) {
            if (typeof v === 'object' && v.value != null) heightMod = v.value;
            else if (typeof v === 'number') heightMod = v;
          }
        }
      }
      // Direct ID match via H-prefix (H1=STD, H2=STEP, H3=EXT, H4=SCAFFOLD)
      const modValue = hf.time_modifier != null ? hf.time_modifier : hf.value;
      if (hf.id && modValue != null) {
        const idLower = hf.id.toLowerCase();
        const band = (ctx.height_band || 'STD').toLowerCase();
        if ((band === 'std' && (idLower.startsWith('h1') || idLower.includes('standard'))) ||
            (band === 'step' && (idLower.startsWith('h2') || idLower.includes('tall'))) ||
            (band === 'ext' && (idLower.startsWith('h3') || idLower.includes('high'))) ||
            (band === 'scaffold' && (idLower.startsWith('h4') || idLower.includes('scaffold'))) ||
            (band === 'lift' && (idLower.startsWith('h5') || idLower.includes('lift')))) {
          heightMod = modValue;
        }
      }
    }
    if (heightMod === 1.0 && ctx.height_band && ctx.height_band !== 'STD') {
      warnings.push(`Height modifier for band ${ctx.height_band} not resolved from DB for ${specFamilyId}. Using 1.0 (neutral).`);
    }
  } else if (ctx.height_band && ctx.height_band !== 'STD') {
    warnings.push(`No height modifiers in DB for ${specFamilyId}. Using 1.0 (neutral).`);
  }

  // 3. Texture modifier — from factor_modifiers
  let textureMod = 1.0;
  const texFactors = db.factor_modifiers.filter(
    f => f.spec_family_id === specFamilyId && f.modifier_category === 'texture'
  );
  if (texFactors.length > 0) {
    for (const tf of texFactors) {
      if (tf.condition && typeof tf.condition === 'object') {
        const texKey = ctx.surface_texture || 'smooth';
        for (const [k, v] of Object.entries(tf.condition)) {
          if (k === texKey || k.toLowerCase() === texKey.toLowerCase()) {
            if (typeof v === 'object' && v.value != null) textureMod = v.value;
            else if (typeof v === 'number') textureMod = v;
          }
        }
      }
    }
  }
  if (textureMod === 1.0 && ctx.surface_texture && ctx.surface_texture !== 'smooth') {
    warnings.push(`Texture modifier for ${ctx.surface_texture} not found in DB for ${specFamilyId}. Using 1.0 (neutral).`);
  }

  // 4. Complexity modifier — no DB rows exist yet; warn if non-standard
  let complexityMod = 1.0;
  if (ctx.complexity && ctx.complexity !== 'STD') {
    warnings.push(`Complexity modifier for ${ctx.complexity} not available in DB for ${specFamilyId}. Using 1.0 (neutral).`);
  }

  const total = qtMod * heightMod * textureMod * complexityMod;

  return { qt: qtMod, height: heightMod, texture: textureMod, complexity: complexityMod, total: Math.round(total * 1000) / 1000 };
}

/**
 * Compute per-item results for window tasks using PS_OPENING_EA.WINDOW_TOTAL.
 * Returns an array of per-item results, each representing a unique window item
 * (type × size combination) with its own modifiers and hours.
 * Each result: { hours, quantity, label, sizeMod, typeMod, itemMod }
 */
function computeWindowPerItemResults(effRate, modStackTotal, room) {
  const wins = room.substrates?.windows?.items || [];
  const results = [];

  wins.forEach(win => {
    const cnt = win.count || 0;
    if (cnt <= 0) return;
    const sizeMod = WINDOW_SIZE_MODIFIERS[win.size_bucket] || 1.0;
    const typeMod = WINDOW_TYPE_MODIFIERS[win.window_type] || 1.0;
    const itemMod = sizeMod * typeMod;
    // effective_rate = base_rate / (room_modifiers * size_modifier * type_modifier)
    const itemEffRate = effRate / (modStackTotal * itemMod);
    const hours = cnt / itemEffRate;
    const typeLabel = WINDOW_TYPE_LABELS[win.window_type] || win.window_type;
    const sizeLabel = WINDOW_SIZE_LABELS[win.size_bucket] || win.size_bucket;
    results.push({
      hours,
      quantity: cnt,
      label: `${typeLabel} ${sizeLabel}`,
      sizeMod,
      typeMod,
      itemMod
    });
  });

  return results.length > 0 ? results : null;
}

/**
 * Compute per-item results for door tasks using PS_SURFACE_EA_SIDE.DOOR_SLAB
 * or PS_OPENING_EA.DOOR_OPENINGS_TOTAL.
 * Returns an array of per-item results, each representing a unique door type
 * with its complexity modifier and hours.
 * @param useSides - true for EA_SIDE tasks, false for EA (opening) tasks
 */
function computeDoorPerItemResults(effRate, modStackTotal, room, useSides) {
  const doors = room.substrates?.doors?.items || [];
  const results = [];

  doors.forEach(door => {
    const cnt = door.count || 0;
    if (cnt <= 0) return;
    const qty = useSides ? cnt * (parseInt(door.sides_per_door) || 2) : cnt;
    const typeMod = DOOR_TYPE_MODIFIERS[door.door_type] || 1.0;
    // effective_rate = base_rate / (room_modifiers * type_modifier)
    const itemEffRate = effRate / (modStackTotal * typeMod);
    const hours = qty / itemEffRate;
    const typeLabel = DOOR_TYPE_LABELS[door.door_type] || door.door_type;
    results.push({
      hours,
      quantity: qty,
      label: typeLabel,
      typeMod,
      itemMod: typeMod
    });
  });

  return results.length > 0 ? results : null;
}

/**
 * Resolve a task's effective rate from its production rate row + context.
 * Returns { effectiveRate, isFixed, fixedMinutes, uom, source }
 */
function resolveTaskRate(rateRow, ctx) {
  const qt = ctx.quality_tier || 'QT3';

  // 1. Try rates_by_tier first (per-QT rates)
  if (rateRow.rates_by_tier && typeof rateRow.rates_by_tier === 'object') {
    const tierData = rateRow.rates_by_tier[qt];
    if (tierData && typeof tierData === 'object') {
      // Search for any rate_* key
      for (const [k, v] of Object.entries(tierData)) {
        if (k.startsWith('rate_') && typeof v === 'number' && v > 0) {
          return { effectiveRate: v, isFixed: false, fixedMinutes: null, uom: rateRow.unit_of_measure, source: 'rates_by_tier' };
        }
      }
    }
  }

  // 2. Try fixed_minutes_by_tier
  if (rateRow.fixed_minutes_by_tier && typeof rateRow.fixed_minutes_by_tier === 'object') {
    const tierMin = rateRow.fixed_minutes_by_tier[qt];
    if (tierMin != null && typeof tierMin === 'number') {
      return { effectiveRate: null, isFixed: true, fixedMinutes: tierMin, uom: rateRow.unit_of_measure, source: 'fixed_minutes_by_tier' };
    }
  }

  // 3. Try flat rate_per_hour
  if (rateRow.rate_per_hour != null && rateRow.rate_per_hour > 0) {
    return { effectiveRate: rateRow.rate_per_hour, isFixed: false, fixedMinutes: null, uom: rateRow.unit_of_measure, source: 'rate_per_hour' };
  }

  // 4. Try flat fixed_minutes
  if (rateRow.fixed_minutes != null && rateRow.fixed_minutes > 0) {
    return { effectiveRate: null, isFixed: true, fixedMinutes: rateRow.fixed_minutes, uom: rateRow.unit_of_measure, source: 'fixed_minutes' };
  }

  return null; // No rate available
}

/**
 * Main estimation orchestrator.
 * Returns { specResults[], totalHours, totalCrewDays, warnings[], materialEstimates[] }
 */
function runEstimate(state, db) {
  const { project, rooms } = state;
  const roomLookups = buildRoomQuantityLookups(state);
  const warnings = [];
  let specResults = [];
  let grandTotalHours = 0;

  // Index required inputs by spec
  const requiredInputsBySpec = {};
  db.spec_required_inputs.forEach(ri => {
    if (!requiredInputsBySpec[ri.spec_family_id]) requiredInputsBySpec[ri.spec_family_id] = [];
    requiredInputsBySpec[ri.spec_family_id].push(ri);
  });

  // Index modules and tasks by spec
  const modulesBySpec = {};
  db.sop_modules.forEach(m => {
    if (!modulesBySpec[m.spec_family_id]) modulesBySpec[m.spec_family_id] = [];
    modulesBySpec[m.spec_family_id].push(m);
  });

  const tasksByModule = {};
  db.sop_tasks.forEach(t => {
    const key = `${t.spec_family_id}::${t.module_id}`;
    if (!tasksByModule[key]) tasksByModule[key] = [];
    tasksByModule[key].push(t);
  });

  // Index production rates by spec+task
  const ratesByTask = {};
  db.task_production_rates.forEach(r => {
    const key = `${r.spec_family_id}::${r.task_id}`;
    if (!ratesByTask[key]) ratesByTask[key] = [];
    ratesByTask[key].push(r);
  });

  // Dedup tracker: per-room fixture protection and full-cover floor protection
  // Prevents duplicate masking when multiple specs (wall + ceiling) fire in same room
  const roomProtectionClaimed = {};  // roomIndex → Set of claimed zone IDs

  // For each spec family
  db.spec_families.forEach(spec => {
    const inputs = requiredInputsBySpec[spec.id] || [];
    const modules = (modulesBySpec[spec.id] || []).sort((a,b) => (a.sort_order||0)-(b.sort_order||0));

    if (modules.length === 0) return; // No modules = skip

    // Check if this spec has any matching quantities across all rooms
    // AND substrate state is compatible with the spec's valid_input_states
    let specHasQuantity = false;
    const allPsKeys = inputs.map(i => i.paintscope_key);
    // For activation: only check surface/opening keys — meta, protection, edge, and modifier
    // keys exist in every room and would cause phantom spec activation
    const psKeys = allPsKeys.filter(k => k.startsWith('PS_SURFACE_') || k.startsWith('PS_OPENING_EA.'));

    rooms.forEach((room, ri) => {
      const roomQty = roomLookups.get(ri);
      if (psKeys.some(k => roomQty && roomQty.has(k) && roomQty.get(k).value > 0)) {
        // Quantity exists — now check substrate state compatibility
        if (isSpecStateCompatible(spec.id, room)) {
          specHasQuantity = true;
        }
      }
    });

    if (!specHasQuantity) {
      return; // Skip spec — no quantities match or substrate state incompatible
    }

    let specTotalHours = 0;
    const phaseHours = {};
    const taskResults = [];

    // For each room
    rooms.forEach((room, ri) => {
      const roomQty = roomLookups.get(ri);

      // Per-room activation: skip this room if it has NONE of the spec's activation keys
      // OR if the room's substrate state is incompatible with this spec
      const roomHasSpec = psKeys.some(k => roomQty && roomQty.has(k) && roomQty.get(k).value > 0);
      if (!roomHasSpec) return;
      if (!isSpecStateCompatible(spec.id, room)) return;

      // Resolve substrate_state for this spec's substrate in this room (SS_* enum)
      // Used by combined specs' applies_when conditions on primer modules
      const roomSpecStates = resolveSubstrateStateForSpec(spec.id, room);
      const roomDerived = deriveRoom(room);
      const ctx = {
        quality_tier: resolveQualityTier(spec.id, room, project),
        height_band: roomDerived.heightBand,
        complexity: room.complexity || project.default_complexity,
        application_method: resolveApplicationMethod(spec.id, room, project),
        surface_texture: resolveTextureForSpec(spec.id, room, project),
        substrate_state: (roomSpecStates && roomSpecStates.length > 0) ? roomSpecStates[0] : null,
        // Phase 1: NC residential windows are wood. Metal support deferred.
        // Enables correct filtering of applies_when: { substrate: ["aluminum","steel"] }
        substrate: (spec.id === 'SF_WINDOW_INT_NC') ? 'wood' : undefined,
        // Room adjacency context — drives floor protection and fixture masking tasks
        floor_type: room.floor_type || 'subfloor',
        floor_protection: room.floor_protection || '',
      };
      // Fixture presence as boolean context keys for applies_when matching
      // Default all fixtures to false so applies_when: { has_X: [true] } fails when absent
      FIXTURE_CATALOG.forEach(f => { ctx['has_' + f.id] = false; });
      Object.keys(room.fixtures || {}).forEach(fId => { ctx['has_' + fId] = true; });

      // Beam overrides for arch element spec
      if (spec.id === 'SF_ARCH_ELEMENT_NC' && room.vaulted_ceiling && room.beams_enabled) {
        // Height: use peak_height_ft (beams are always overhead)
        const peakFt = parseFloat(room.peak_height_ft) || 0;
        if (peakFt > 0) {
          ctx.height_band = deriveHeightBand(peakFt);
        }
        // Application method: use beam-specific setting
        if (room.beam_application_method) {
          ctx.application_method = room.beam_application_method;
        }
        // Substrate state: use beam-specific setting
        if (room.beam_substrate_state) {
          const mapped = UI_STATE_TO_SPEC_STATE[room.beam_substrate_state];
          if (mapped) ctx.substrate_state = mapped;
        }
      }

      const modStack = computeModifierStack(spec.id, ctx, db, warnings);

      // Coat count lookup: how many finish coats and interstage cycles for this spec+tier+method
      let finishCoats = 1, interstageCycles = 1;
      if (db.coat_counts) {
        const qt = ctx.quality_tier || 'QT3';
        const method = ctx.application_method || 'spray';
        const tierKey = qt === 'QT5' ? ('QT5_' + (method.startsWith('spray') ? 'spray' : 'brush')) : qt;
        const ccRow = db.coat_counts.find(r => r.spec_family_id === spec.id && r.tier_key === tierKey);
        if (ccRow) {
          finishCoats = ccRow.finish_coats || 1;
          interstageCycles = ccRow.interstage_cycles || 1;
        }
      }

      // For each module -> task
      modules.forEach(mod => {
        // Check module applies_when
        if (!evaluateAppliesWhen(mod.applies_when, ctx)) return;

        // Coat multiplier: finish coat modules repeat per coat, interstage repeats per cycle
        // Exclude FINAL_INSPECT and _COAT_2 modules (already handle multi-coat structurally)
        let coatMultiplier = 1;
        if (mod.phase === 'interstage') {
          coatMultiplier = interstageCycles;
        } else if (mod.phase === 'finish' && !mod.id.includes('FINAL') && !/_COAT_\d/.test(mod.id)) {
          coatMultiplier = finishCoats;
        }

        const tasks = (tasksByModule[`${spec.id}::${mod.id}`] || []).sort((a,b) => (a.sort_order||0)-(b.sort_order||0));

        tasks.forEach(task => {
          // Check appears_in_tiers
          if (task.appears_in_tiers && Array.isArray(task.appears_in_tiers)) {
            if (!task.appears_in_tiers.includes(ctx.quality_tier)) return;
          }

          // Check task applies_when
          if (!evaluateAppliesWhen(task.applies_when, ctx)) return;

          // Dedup guard: prevents duplicate protection when multiple specs fire in same room
          if (!roomProtectionClaimed[ri]) roomProtectionClaimed[ri] = new Set();
          // Fixture protection dedup (wall + ceiling specs share fixture tasks)
          if (mod.id.includes('ROOM_FIXTURES') || mod.id.includes('TEARDOWN_ROOM_FIXTURES')) {
            const zoneKey = task.id.replace(/^TSK_(WALL_P|WALL_F|CEIL_P|CEIL_F)_/, 'FIX_');
            if (roomProtectionClaimed[ri].has(zoneKey)) return;
            roomProtectionClaimed[ri].add(zoneKey);
          }
          // Full-cover floor protection dedup (wall prime + ceiling prime both have full floor cover)
          if (task.name && task.name.toLowerCase().includes('floor protection') && task.name.toLowerCase().includes('full room')) {
            const floorKey = 'FLOOR_FULL_COVER';
            if (roomProtectionClaimed[ri].has(floorKey)) return;
            roomProtectionClaimed[ri].add(floorKey);
          }

          // Get production rates for this task
          const rates = ratesByTask[`${spec.id}::${task.id}`] || [];
          if (rates.length === 0) {
            warnings.push(`No production rate found for task ${task.id} in ${spec.id} with config ${JSON.stringify(ctx)}`);
            return;
          }

          rates.forEach(rateRow => {
            // Check rate applies_when
            if (!evaluateAppliesWhen(rateRow.applies_when, ctx)) return;

            const resolved = resolveTaskRate(rateRow, ctx);
            if (!resolved) return;

            const phase = mod.phase || 'apply';
            const psKey = rateRow.paintscope_key;

            // Helper: push a single task result entry (applies coat multiplier from module)
            const pushResult = (hrs, qty, label, itemModStack, itemGroup) => {
              if (hrs <= 0) return;
              const singleCoatHrs = Math.round(hrs * 1000) / 1000;
              const totalHrs = Math.round(singleCoatHrs * coatMultiplier * 1000) / 1000;
              phaseHours[phase] = (phaseHours[phase] || 0) + totalHrs;
              specTotalHours += totalHrs;
              taskResults.push({
                taskId: task.id,
                taskName: task.name,
                phase: phase,
                moduleName: mod.name,
                roomIndex: ri,
                roomLabel: room.label,
                psKey: psKey || '(fixed)',
                uom: resolved.uom,
                quantity: Math.round(qty * 100) / 100,
                baseRate: resolved.isFixed ? `${resolved.fixedMinutes}m` : resolved.effectiveRate,
                modStack: itemModStack || { ...modStack },
                hours: totalHrs,
                coatMultiplier: coatMultiplier,
                skillLevel: task.skill_level,
                crewSize: rateRow.crew_size || 1,
                isFixed: resolved.isFixed,
                itemGroup: itemGroup || null,
                floorType: ctx.floor_type || null
              });
            };

            if (resolved.isFixed) {
              // FIXED: hours = fixed_minutes / 60 (no modifier per doctrine)
              pushResult(resolved.fixedMinutes / 60, 1, null, { ...modStack });
            } else if (psKey === 'PS_OPENING_EA.WINDOW_TOTAL' && spec.id === 'SF_WINDOW_INT_NC') {
              // Per-item window calculation: separate line items per window type × size
              const itemResults = computeWindowPerItemResults(resolved.effectiveRate, modStack.total, room);
              if (itemResults) {
                itemResults.forEach(ir => {
                  pushResult(ir.hours, ir.quantity, null,
                    { ...modStack, sizeMod: ir.sizeMod, typeMod: ir.typeMod, total: Math.round(modStack.total * ir.itemMod * 1000) / 1000 },
                    ir.label);
                });
              }
            } else if ((psKey === 'PS_SURFACE_EA_SIDE.DOOR_SLAB' || psKey === 'PS_OPENING_EA.DOOR_OPENINGS_TOTAL') && spec.id === 'SF_DOOR_SLAB_INT_NC') {
              // Per-item door calculation: separate line items per door type
              const useSides = psKey === 'PS_SURFACE_EA_SIDE.DOOR_SLAB';
              const itemResults = computeDoorPerItemResults(resolved.effectiveRate, modStack.total, room, useSides);
              if (itemResults) {
                itemResults.forEach(ir => {
                  pushResult(ir.hours, ir.quantity, null,
                    { ...modStack, typeMod: ir.typeMod, total: Math.round(modStack.total * ir.itemMod * 1000) / 1000 },
                    ir.label);
                });
              }
            } else if (psKey && roomQty && roomQty.has(psKey)) {
              // Standard rate-based calculation
              const quantity = roomQty.get(psKey).value;
              const effRate = resolved.effectiveRate / modStack.total;
              pushResult(quantity / effRate, quantity, null, { ...modStack });
            } else if (!psKey) {
              return; // No PS key — skip
            } else {
              return; // No quantity for this key in this room
            }
          });
        });
      });
    });

    if (specTotalHours > 0 || taskResults.length > 0) {
      specResults.push({
        specId: spec.id,
        specName: spec.name,
        domain: spec.domain,
        totalHours: Math.round(specTotalHours * 100) / 100,
        phaseHours: Object.fromEntries(Object.entries(phaseHours).map(([k,v]) => [k, Math.round(v*100)/100])),
        tasks: taskResults
      });
      grandTotalHours += specTotalHours;
    }
  });

  // Split door/window specs into per-type sub-entries for grouped display
  const SPECS_WITH_ITEM_GROUPS = ['SF_DOOR_SLAB_INT_NC', 'SF_WINDOW_INT_NC'];
  const expandedSpecResults = [];
  specResults.forEach(sr => {
    // Check if this spec has per-item grouped tasks
    const hasGroups = SPECS_WITH_ITEM_GROUPS.includes(sr.specId) &&
                      sr.tasks.some(t => t.itemGroup);
    if (!hasGroups) {
      expandedSpecResults.push(sr);
      return;
    }

    // Collect unique item groups and shared (ungrouped) tasks
    const groups = {};
    const shared = [];
    sr.tasks.forEach(t => {
      if (t.itemGroup) {
        if (!groups[t.itemGroup]) groups[t.itemGroup] = [];
        groups[t.itemGroup].push(t);
      } else {
        shared.push(t);
      }
    });

    // Create a sub-result per item group
    const groupEntries = Object.entries(groups);
    groupEntries.forEach(([group, tasks]) => {
      // Prorate shared tasks across groups by proportion of grouped hours
      const groupedTotalHrs = groupEntries.reduce((s, [, ts]) => s + ts.reduce((s2, t) => s2 + t.hours, 0), 0);
      const groupHrs = tasks.reduce((s, t) => s + t.hours, 0);
      const proportion = groupedTotalHrs > 0 ? groupHrs / groupedTotalHrs : 1 / groupEntries.length;

      // Create prorated copies of shared tasks for this group
      const proratedShared = shared.map(t => ({
        ...t,
        hours: Math.round(t.hours * proportion * 1000) / 1000,
        quantity: Math.round(t.quantity * proportion * 100) / 100,
        itemGroup: group
      }));

      const allTasks = [...proratedShared, ...tasks];
      const totalHours = allTasks.reduce((s, t) => s + t.hours, 0);
      const phaseHours = {};
      allTasks.forEach(t => { phaseHours[t.phase] = (phaseHours[t.phase] || 0) + t.hours; });

      expandedSpecResults.push({
        ...sr,
        specName: `${SPEC_DISPLAY_NAMES[sr.specId] || sr.specName} — ${group}`,
        specId: sr.specId,
        itemGroup: group,
        totalHours: Math.round(totalHours * 100) / 100,
        phaseHours: Object.fromEntries(Object.entries(phaseHours).map(([k, v]) => [k, Math.round(v * 100) / 100])),
        tasks: allTasks
      });
    });
  });
  specResults = expandedSpecResults;

  // Sort specs by total hours descending
  specResults.sort((a,b) => b.totalHours - a.totalHours);

  // Room-level floor protection deduplication
  const roomProtection = resolveRoomFloorProtection(specResults, db, rooms);

  // Recalculate grand total (some hours moved from specs to room protection)
  grandTotalHours = specResults.reduce((s, sr) => s + sr.totalHours, 0);
  Object.values(roomProtection).forEach(rp => { grandTotalHours += rp.totalHours; });

  // Material estimates
  const materialEstimates = computeMaterialEstimates(state, db, roomLookups);

  const crewDays = grandTotalHours / 8 / 2; // 8hr day, 2-person crew

  return {
    specResults,
    roomProtection,
    totalHours: Math.round(grandTotalHours * 100) / 100,
    totalCrewDays: Math.round(crewDays * 10) / 10,
    warnings,
    materialEstimates,
    activatedSpecs: specResults.length,
    totalSpecs: db.spec_families.length
  };
}

/**
 * Compute material estimates from coverage profiles.
 */
function computeMaterialEstimates(state, db, roomLookups) {
  const estimates = [];
  const { project, rooms } = state;
  const SPRAY_LOSS_FACTOR = 0.05; // 5% material loss for spray application

  // Resolve project-level config
  const defaultQT = project.default_quality_tier || 'QT3';
  const defaultTexture = project.default_texture || 'smooth';
  const defaultMethod = project.default_application_method || 'brush';
  const isSpray = defaultMethod.includes('spray');

  // Aggregate quantities across all rooms by spec family
  // We need per-spec quantities to match coverage profiles to specs
  const totalQty = new Map();
  roomLookups.forEach((roomQty) => {
    roomQty.forEach((val, key) => {
      const existing = totalQty.get(key);
      if (existing) existing.value += val.value;
      else totalQty.set(key, { ...val });
    });
  });

  // Build a map: spec_family_id -> list of applicable material systems
  const systemsBySpec = {};
  (db.material_systems || []).forEach(ms => {
    if (!systemsBySpec[ms.spec_family_id]) systemsBySpec[ms.spec_family_id] = [];
    systemsBySpec[ms.spec_family_id].push(ms);
  });

  // Build a map: spec_family_id::system_id -> material_system_products
  const productsBySystem = {};
  (db.material_system_products || []).forEach(msp => {
    const key = msp.spec_family_id + '::' + msp.system_id;
    if (!productsBySystem[key]) productsBySystem[key] = [];
    productsBySystem[key].push(msp);
  });

  // For each spec family with coverage profiles, resolve materials
  const specFamilyIds = [...new Set(db.material_coverage_profiles.map(cp => cp.spec_family_id))];

  specFamilyIds.forEach(specId => {
    const specProfiles = db.material_coverage_profiles.filter(cp => cp.spec_family_id === specId);
    const specSystems = systemsBySpec[specId] || [];

    // Determine which PaintScope keys this spec uses (from spec_required_inputs)
    const specInputs = (db.spec_required_inputs || []).filter(i => i.spec_family_id === specId);
    const psKeys = specInputs.map(i => i.paintscope_key);

    // Check if this spec has matching quantities
    let specSF = 0;
    let matchedKey = null;
    psKeys.forEach(k => {
      const q = totalQty.get(k);
      if (q && q.value > 0) {
        specSF += q.value;
        matchedKey = k;
      }
    });

    if (specSF <= 0) return; // No quantities for this spec

    // Resolve material system for this spec based on quality tier
    // Default sheen: eggshell (most common for walls), flat for ceilings/priming
    let defaultSheen = 'eggshell';
    if (specId.includes('CEILING')) defaultSheen = 'flat';
    if (specId.includes('PRIME')) defaultSheen = 'flat';
    if (specId.includes('TRIM') || specId.includes('DOOR') || specId.includes('CABINET') || specId.includes('WINDOW')) defaultSheen = 'semi-gloss';

    // Find matching system by quality tier + sheen
    let matchedSystem = null;
    specSystems.forEach(ms => {
      if (ms.applies_when) {
        const aw = typeof ms.applies_when === 'string' ? JSON.parse(ms.applies_when) : ms.applies_when;
        const qtMatch = !aw.quality_tier || aw.quality_tier.includes(defaultQT);
        const sheenMatch = !aw.finish_sheen || aw.finish_sheen.includes(defaultSheen);
        if (qtMatch && sheenMatch && !matchedSystem) {
          matchedSystem = ms;
        }
      }
    });

    // Fallback: pick first system for this spec
    if (!matchedSystem && specSystems.length > 0) {
      matchedSystem = specSystems[0];
    }

    // Get coats from material_system_products
    let coats = 1; // default
    if (matchedSystem) {
      const products = productsBySystem[specId + '::' + matchedSystem.id] || [];
      if (products.length > 0) {
        // Use the first product's coats (finish role preferred)
        const finishProd = products.find(p => (p.product_role || '').includes('finish')) || products[0];
        if (finishProd.coats_required) coats = finishProd.coats_required;
      }
    }

    // Find coverage profile matching system + texture
    let matchedProfile = null;
    specProfiles.forEach(cp => {
      // Check if coverage profile belongs to our matched system
      let cpSystems = cp.material_system;
      if (typeof cpSystems === 'string') {
        try { cpSystems = JSON.parse(cpSystems); } catch(e) { cpSystems = [cpSystems]; }
      }
      if (!Array.isArray(cpSystems)) cpSystems = [cpSystems];

      const systemMatch = !matchedSystem || cpSystems.includes(matchedSystem.id);

      // Check texture match
      let textures = cp.surface_texture;
      if (typeof textures === 'string') {
        try { textures = JSON.parse(textures); } catch(e) { textures = [textures]; }
      }
      if (!Array.isArray(textures)) textures = [textures];
      const textureMatch = textures.includes(defaultTexture);

      if (systemMatch && textureMatch && !matchedProfile) {
        matchedProfile = cp;
      }
    });

    // Fallback: use first profile for this spec + matched system
    if (!matchedProfile) {
      matchedProfile = specProfiles.find(cp => {
        let cpSystems = cp.material_system;
        if (typeof cpSystems === 'string') {
          try { cpSystems = JSON.parse(cpSystems); } catch(e) { cpSystems = [cpSystems]; }
        }
        if (!Array.isArray(cpSystems)) cpSystems = [cpSystems];
        return !matchedSystem || cpSystems.includes(matchedSystem.id);
      }) || specProfiles[0];
    }

    if (!matchedProfile || !matchedProfile.coverage_sf_per_gallon) return;

    // Compute gallons: (SF * coats) / coverage_rate / (1 - spray_loss)
    const rawGallons = (specSF * coats) / matchedProfile.coverage_sf_per_gallon;
    const sprayMultiplier = isSpray ? (1 / (1 - SPRAY_LOSS_FACTOR)) : 1;
    const gallons = rawGallons * sprayMultiplier;

    estimates.push({
      specFamilyId: specId,
      systemName: matchedSystem ? matchedSystem.name : '(unknown)',
      productRole: matchedProfile.product_role || 'finish',
      surfaceTexture: defaultTexture,
      totalSF: Math.round(specSF),
      coverageRate: matchedProfile.coverage_sf_per_gallon,
      coats: coats,
      gallons: Math.round(gallons * 10) / 10,
      sprayLoss: isSpray ? SPRAY_LOSS_FACTOR : 0,
      psKey: matchedKey
    });
  });

  return estimates;
}

// --- Select helper ---
function Sel({ options, value, onChange, placeholder, ...props }) {
  return (
    <select value={value||''} onChange={e=>onChange(e.target.value)} {...props}>

// --- Number input with override ---
function NumField({ value, derived, isOverride, onValueChange, onOverrideToggle, label, uom }) {
  const displayVal = isOverride ? value : derived;

    <div style={{display:'flex',alignItems:'center',gap:4}}>
