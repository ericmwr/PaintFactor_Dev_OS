<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaintScope Prototype v0.3 — Substrate-First Room Editor</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ============================================================
   DARK INDUSTRIAL THEME
   ============================================================ */
:root {
  --bg-base: #0d1117;
  --bg-panel: #161b22;
  --bg-card: #1c2128;
  --bg-input: #0d1117;
  --bg-hover: #21262d;
  --bg-active: #1a2332;
  --border: #30363d;
  --border-focus: #58a6ff;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #484f58;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --danger: #f85149;
  --success: #3fb950;
  --warning: #d29922;
  --derived: #8b5cf6;
  --derived-bg: rgba(139,92,246,0.08);
  --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.4;
  overflow: hidden;
  height: 100vh;
}

/* Layout */
.app-layout { display:flex; height:100vh; }
.sidebar {
  width: 260px; min-width:260px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.main-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.main-content { flex:1; overflow-y:auto; padding:16px 20px; }

/* Header */
.app-header {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: flex; align-items: center; justify-content: space-between;
  min-height: 44px;
}
.app-title { font-size:14px; font-weight:600; color:var(--text-primary); letter-spacing:0.5px; }
.app-title span { color:var(--accent); }

/* Buttons */
.btn {
  display:inline-flex; align-items:center; gap:4px;
  padding:4px 10px; border-radius:4px; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text-primary); cursor:pointer;
  font-size:12px; font-family:var(--font-sans); transition:all .15s;
}
.btn:hover { background:var(--bg-hover); border-color:var(--border-focus); }
.btn-sm { padding:2px 8px; font-size:11px; }
.btn-accent { background:rgba(88,166,255,0.12); border-color:var(--accent); color:var(--accent); }
.btn-accent:hover { background:rgba(88,166,255,0.2); }
.btn-danger { color:var(--danger); border-color:rgba(248,81,73,0.3); }
.btn-danger:hover { background:rgba(248,81,73,0.1); }
.btn-success { color:var(--success); border-color:rgba(63,185,80,0.3); }
.btn-success:hover { background:rgba(63,185,80,0.1); }
.btn-group { display:flex; gap:4px; }

/* Inputs */
input, select, textarea {
  background: var(--bg-input); border:1px solid var(--border); color:var(--text-primary);
  padding:4px 8px; border-radius:3px; font-size:13px; font-family:var(--font-sans);
  outline:none; transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color:var(--border-focus); }
input[type="number"] { width:80px; font-family:var(--font-mono); text-align:right; }
input[type="checkbox"] { width:auto; accent-color:var(--accent); cursor:pointer; }
select { cursor:pointer; padding-right:20px; }
textarea { width:100%; resize:vertical; min-height:60px; }

input.derived {
  background: var(--derived-bg); border-color:rgba(139,92,246,0.3);
  color:var(--derived);
}
input.invalid { border-color:var(--danger); }

/* Labels */
label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
.field-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:2px; }
.badge {
  font-size:9px; padding:1px 4px; border-radius:2px; font-weight:600;
  text-transform:uppercase; letter-spacing:0.5px;
}
.badge-auto { background:rgba(139,92,246,0.15); color:var(--derived); }
.badge-manual { background:rgba(88,166,255,0.12); color:var(--accent); }
.badge-count { background:rgba(88,166,255,0.15); color:var(--accent); font-size:10px; padding:0 5px; border-radius:8px; }

/* Sidebar */
.sidebar-header {
  padding:10px 12px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.sidebar-title { font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
.room-list { flex:1; overflow-y:auto; padding:4px 0; }
.room-item {
  padding:8px 12px; cursor:pointer; border-left:3px solid transparent;
  display:flex; align-items:center; justify-content:space-between;
  transition: all .1s;
}
.room-item:hover { background:var(--bg-hover); }
.room-item.active { background:var(--bg-active); border-left-color:var(--accent); }
.room-item-label { font-size:13px; font-weight:500; }
.room-item-meta { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); }
.room-item-actions { display:flex; gap:2px; opacity:0; transition:opacity .1s; }
.room-item:hover .room-item-actions { opacity:1; }

.sidebar-presets { padding:8px 12px; border-top:1px solid var(--border); }
.presets-grid { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }

/* Tabs */
.tab-bar {
  display:flex; gap:0; border-bottom:1px solid var(--border);
  background:var(--bg-panel); padding:0 16px; overflow-x:auto;
}
.tab {
  padding:8px 14px; cursor:pointer; font-size:12px; color:var(--text-secondary);
  border-bottom:2px solid transparent; transition:all .15s; white-space:nowrap;
}
.tab:hover { color:var(--text-primary); background:var(--bg-hover); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* Grid layouts */
.form-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
.form-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.form-group { margin-bottom:12px; }
.inline-field { display:flex; align-items:center; gap:6px; }

/* Table-like layouts for doors/windows */
.data-table { width:100%; border-collapse:collapse; }
.data-table th {
  font-size:10px; color:var(--text-muted); text-transform:uppercase;
  letter-spacing:0.5px; padding:4px 8px; text-align:left; border-bottom:1px solid var(--border);
}
.data-table td { padding:4px 8px; border-bottom:1px solid rgba(48,54,61,0.5); }
.data-table tr:hover { background:var(--bg-hover); }

/* Panel sections */
.panel-section { margin-bottom:20px; }
.section-title {
  font-size:12px; font-weight:600; color:var(--text-secondary);
  margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}

/* Summary */
.summary-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.summary-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:4px; padding:12px;
}
.summary-card-title { font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
.summary-row { display:flex; justify-content:space-between; padding:2px 0; font-size:12px; }
.summary-value { font-family:var(--font-mono); color:var(--accent); }
.summary-total { font-weight:700; border-top:1px solid var(--border); padding-top:4px; margin-top:4px; }

/* JSON view */
.json-view {
  background:var(--bg-input); border:1px solid var(--border); border-radius:4px;
  padding:12px; font-family:var(--font-mono); font-size:11px; line-height:1.5;
  overflow:auto; max-height:60vh; white-space:pre-wrap; word-break:break-all;
}

/* Nav views */
.nav-bar {
  display:flex; gap:0; background:var(--bg-panel); border-bottom:1px solid var(--border);
}
.nav-item {
  padding:10px 16px; cursor:pointer; font-size:13px; color:var(--text-secondary);
  border-bottom:2px solid transparent; transition:all .15s; font-weight:500;
}
.nav-item:hover { color:var(--text-primary); background:var(--bg-hover); }
.nav-item.active { color:var(--accent); border-bottom-color:var(--accent); }

/* Setup form */
.setup-form { max-width:560px; margin:0 auto; }
.setup-field { margin-bottom:14px; }
.setup-field label { font-size:13px; color:var(--text-primary); margin-bottom:4px; display:block; }
.setup-field input, .setup-field select { width:100%; }
.setup-field .hint { font-size:11px; color:var(--text-muted); margin-top:2px; }

/* Toggle switch */
.toggle { display:flex; align-items:center; gap:6px; cursor:pointer; }
.toggle-track {
  width:32px; height:18px; border-radius:9px; background:var(--border);
  position:relative; transition:background .2s;
}
.toggle-track.on { background:var(--accent); }
.toggle-thumb {
  width:14px; height:14px; border-radius:50%; background:var(--text-primary);
  position:absolute; top:2px; left:2px; transition:left .2s;
}
.toggle-track.on .toggle-thumb { left:16px; }

/* Override indicator */
.override-toggle {
  font-size:10px; cursor:pointer; padding:1px 4px; border-radius:2px;
  border:1px solid transparent; transition:all .15s;
}
.override-toggle:hover { border-color:var(--border); }
.override-toggle.auto { color:var(--derived); }
.override-toggle.manual { color:var(--accent); }

/* Scrollbar */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-muted); }

/* Master/detail layout */
.master-detail-container { display:flex; gap:16px; min-height:200px; }
.master-list { flex:1 1 50%; overflow-y:auto; max-height:420px; }
.detail-panel { flex:1 1 50%; border-left:1px solid var(--border); padding-left:16px; overflow-y:auto; max-height:420px; }
.substrate-item {
  display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;
  padding:3px 6px; border-radius:4px; border:1px solid transparent; transition:all .15s;
}
.substrate-item:hover { background:var(--bg-hover); }
.substrate-item.focused { border-color:var(--accent); background:rgba(99,102,241,0.08); }
.substrate-item .tab-indicator { font-size:10px; color:var(--text-muted); margin-left:auto; }
.detail-panel-empty {
  display:flex; align-items:center; justify-content:center; height:100%;
  color:var(--text-muted); font-size:12px; font-style:italic;
}

/* Protection badges */
.protection-row { display:flex; align-items:center; gap:6px; padding:3px 0; font-size:11px; }
.protection-badge { font-size:9px; font-weight:600; padding:1px 5px; border-radius:3px; text-transform:uppercase; }
.protection-badge.light_mask { background:#2a3a2a; color:#6ec96e; }
.protection-badge.medium_mask { background:#3a3520; color:#e0b840; }
.protection-badge.heavy_mask { background:#3a2020; color:#e05050; }
.auto-tag { font-size:9px; color:var(--text-muted); font-style:italic; }

/* Toast / status */
.toast {
  position:fixed; bottom:20px; right:20px; background:var(--bg-card);
  border:1px solid var(--success); color:var(--success); padding:8px 16px;
  border-radius:4px; font-size:12px; z-index:100; animation:fadeInOut 2s;
}
@keyframes fadeInOut {
  0%{opacity:0;transform:translateY(10px)} 10%{opacity:1;transform:translateY(0)}
  80%{opacity:1} 100%{opacity:0}
}

/* Import modal */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50;
  display:flex; align-items:center; justify-content:center;
}
.modal {
  background:var(--bg-panel); border:1px solid var(--border); border-radius:6px;
  padding:20px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto;
}
.modal-title { font-size:14px; font-weight:600; margin-bottom:12px; }

/* ============================================================
   ESTIMATE + WORK ORDER VIEWS
   ============================================================ */
.estimate-header {
  background: var(--bg-card); border:1px solid var(--border); border-radius:6px;
  padding:16px 20px; margin-bottom:16px;
}
.estimate-header h2 { font-size:16px; color:var(--accent); margin-bottom:4px; }
.estimate-totals {
  display:flex; gap:20px; font-size:13px; color:var(--text-secondary); margin-top:8px; flex-wrap:wrap;
}
.estimate-totals .big-num { font-size:22px; font-weight:700; color:var(--text-primary); font-family:var(--font-mono); }
.estimate-totals .unit { font-size:11px; color:var(--text-muted); margin-left:2px; }

.warn-panel {
  background:rgba(210,153,34,0.08); border:1px solid rgba(210,153,34,0.3); border-radius:4px;
  padding:8px 12px; margin-bottom:16px; font-size:12px; color:var(--warning);
}
.warn-panel summary { cursor:pointer; font-weight:600; }
.warn-panel ul { margin:6px 0 0 16px; }

.spec-section {
  background:var(--bg-card); border:1px solid var(--border); border-radius:6px;
  margin-bottom:8px; overflow:hidden;
}
.spec-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; cursor:pointer; user-select:none;
}
.spec-header:hover { background:var(--bg-hover); }
.spec-header .spec-name { font-weight:600; font-size:13px; flex:1; }
.spec-header .spec-hours { font-family:var(--font-mono); font-size:14px; font-weight:700; color:var(--accent); margin-right:8px; }
.spec-header .chevron { color:var(--text-muted); font-size:12px; transition:transform .2s; }
.spec-header .chevron.open { transform:rotate(90deg); }

.phase-bar {
  display:flex; gap:4px; padding:4px 16px 8px; flex-wrap:wrap;
}
.phase-chip {
  font-size:11px; padding:2px 8px; border-radius:3px;
  background:var(--bg-panel); color:var(--text-secondary); font-family:var(--font-mono);
}
.phase-chip .phase-label { text-transform:uppercase; font-size:10px; font-weight:600; margin-right:4px; }
.phase-chip .phase-hrs { color:var(--text-primary); }

.task-detail { padding:0 16px 12px; }
.task-table { width:100%; border-collapse:collapse; font-size:12px; }
.task-table th { text-align:left; padding:4px 8px; color:var(--text-muted); font-weight:500; border-bottom:1px solid var(--border); font-size:11px; }
.task-table td { padding:4px 8px; font-family:var(--font-mono); border-bottom:1px solid rgba(48,54,61,0.3); }
.task-table .task-name-col { font-family:var(--font-sans); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.task-table tr:hover td { background:var(--bg-hover); }

.modifier-summary { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.mod-chip {
  background:var(--bg-card); border:1px solid var(--border); border-radius:4px;
  padding:4px 10px; font-size:12px;
}
.mod-chip .mod-label { color:var(--text-muted); margin-right:4px; }
.mod-chip .mod-val { color:var(--text-primary); font-family:var(--font-mono); font-weight:600; }
.mod-chip .mod-val.warn { color:var(--warning); }

.material-section {
  background:var(--bg-card); border:1px solid var(--border); border-radius:6px;
  padding:12px 16px; margin-top:16px;
}
.material-section h3 { font-size:14px; color:var(--text-primary); margin-bottom:8px; }
.mat-row { display:flex; justify-content:space-between; padding:3px 0; font-size:12px; border-bottom:1px solid rgba(48,54,61,0.2); }
.mat-row .mat-name { color:var(--text-secondary); }
.mat-row .mat-qty { font-family:var(--font-mono); color:var(--accent); }

/* Work Order */
.wo-toggle { display:flex; gap:2px; margin-bottom:16px; background:var(--bg-card); border-radius:4px; padding:2px; border:1px solid var(--border); width:fit-content; }
.wo-toggle-btn { padding:6px 16px; border-radius:3px; border:none; background:transparent; color:var(--text-secondary); cursor:pointer; font-size:12px; font-weight:500; }
.wo-toggle-btn.active { background:var(--accent); color:#fff; }

.wo-phase-group { margin-bottom:16px; }
.wo-phase-title { font-size:13px; font-weight:600; text-transform:uppercase; color:var(--accent); padding:6px 0; border-bottom:1px solid var(--border); margin-bottom:6px; letter-spacing:1px; }
.wo-room-group { margin-bottom:20px; }
.wo-room-title { font-size:14px; font-weight:600; padding:8px 12px; background:var(--bg-card); border:1px solid var(--border); border-radius:4px; margin-bottom:6px; }
.wo-room-dims { font-size:11px; color:var(--text-muted); font-family:var(--font-mono); margin-left:8px; }

.wo-task-row { display:grid; grid-template-columns:1fr 90px 70px 70px 50px 70px; gap:4px; padding:3px 8px; font-size:12px; align-items:center; border-bottom:1px solid rgba(48,54,61,0.15); }
.wo-task-row.header { font-weight:600; color:var(--text-muted); font-size:11px; border-bottom:1px solid var(--border); }
.wo-task-row:hover { background:var(--bg-hover); }
.wo-hrs { font-family:var(--font-mono); text-align:right; color:var(--accent); font-weight:600; }
.wo-qty { font-family:var(--font-mono); text-align:right; }
.wo-rate { font-family:var(--font-mono); text-align:right; color:var(--text-muted); }
.wo-skill { font-size:10px; text-align:center; padding:1px 4px; border-radius:2px; }
.wo-skill.L1 { background:rgba(63,185,80,0.15); color:var(--success); }
.wo-skill.L2 { background:rgba(88,166,255,0.15); color:var(--accent); }
.wo-skill.L3 { background:rgba(210,153,34,0.15); color:var(--warning); }
.wo-skill.L4 { background:rgba(248,81,73,0.15); color:var(--danger); }

.section-total { display:flex; justify-content:flex-end; gap:8px; padding:6px 8px; font-weight:600; font-size:13px; border-top:2px solid var(--border); }
.section-total .total-hrs { font-family:var(--font-mono); color:var(--accent); }

.no-data-msg { text-align:center; padding:40px; color:var(--text-muted); font-size:14px; }

@media print {
  body { background:#fff; color:#000; font-size:11px; overflow:visible; height:auto; }
  .app-layout { display:block; height:auto; }
  .sidebar, .app-header, .nav-bar, .btn-group, .btn, .wo-toggle { display:none !important; }
  .main-panel, .main-content { overflow:visible; padding:0; }
  .spec-section, .wo-room-group, .estimate-header, .material-section { break-inside:avoid; border-color:#ccc; background:#fff; }
  .spec-header .spec-hours, .wo-hrs, .total-hrs, .big-num { color:#000; }
  .task-table th, .wo-task-row.header { color:#666; }
}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useReducer, useMemo, useCallback, useEffect, useRef } = React;

let nextId = 1;
function genId(prefix) { return `${prefix}_${nextId++}`; }

function createDoor(overrides={}) {
  return { id:genId('door'), count:1, door_type:'panel_6', substrate_state:'factory_primed', sides_per_door:2, ...overrides };
}
function createWindow(overrides={}) {
  return { id:genId('win'), count:1, window_type:'double_hung', size_bucket:'M', substrate_state:'bare_wood', ...overrides };
}

/** Build a default substrate config by merging catalog defaults with any overrides. */
function createSubstrateConfig(substrateId, overrides={}) {
  const cat = SUBSTRATE_MAP[substrateId];
  if (!cat) return overrides;
  const base = JSON.parse(JSON.stringify(cat.defaultConfig));
  // For items-based substrates (doors/windows), stamp IDs on items
  if (overrides.items && Array.isArray(overrides.items)) {
    if (substrateId === 'doors') overrides.items = overrides.items.map(d => createDoor(d));
    else if (substrateId === 'windows') overrides.items = overrides.items.map(w => createWindow(w));
  }
  return { ...base, ...overrides };
}

function createRoom(overrides={}) {
  const preset = overrides._preset ? ROOM_PRESETS[overrides._preset] : null;
  const base = {
    id: genId('room'),
    label: preset ? preset.label : `Room ${nextId}`,
    area_group: '',
    is_interior: true,
    length_ft: 0, width_ft: 0, height_ft: 8,
    // v0.3 vault/gable
    vaulted_ceiling: false,
    peak_height_ft: 0,
    ridge_direction: 'length',
    gable_walls: 0,
    // v0.4 ceiling beams (conditional on vaulted_ceiling)
    beams_enabled: false,
    peak_beam: false,
    cross_beam_count: 0,
    ridge_beam_count: 0,
    beam_width_in: 6,
    beam_depth_in: 6,
    beam_substrate_state: 'bare_wood',
    beam_application_method: 'brush',
    // Room-level overrides
    quality_tier: null, height_band: null, complexity: null, application_method: null,
    // v0.3 substrate model — starts blank, presence = in scope
    substrates: {},
    // v0.5 adjacency — items present but not being painted
    floor_type: '',
    floor_protection: '',
    fixtures: {},  // keyed by fixture_id → { protection: 'medium_mask', count: 1, size: '', notes: '' }
    notes: ''
  };

  if (preset) {
    base.length_ft = preset.length_ft;
    base.width_ft = preset.width_ft;
    base.height_ft = preset.height_ft;
    base.label = preset.label;
    // Build substrates from preset
    if (preset.substrates) {
      Object.entries(preset.substrates).forEach(([subId, config]) => {
        base.substrates[subId] = createSubstrateConfig(subId, config);
      });
    }
  }
  return base;
}
